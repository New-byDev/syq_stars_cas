<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11140e"><title>ZombixUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10120e;--panel:#191d16;--panel2:#22271d;--line:#343b2b;--gold:#f4d51d;--gold2:#b9a40c;--text:#f5f5e9;--muted:#a0a694;--green:#8bd44a;--red:#ed685c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#333b20 0,transparent 55%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}#app{max-width:1000px;margin:auto;min-height:100vh;padding:14px 14px 90px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:5}.brand{display:flex;align-items:center;gap:10px;font:22px 'Russo One';letter-spacing:.4px}.brand span{color:var(--gold)}.coin{display:flex;align-items:center;gap:8px;background:#262a17;border:1px solid #5d5311;padding:8px 12px;border-radius:12px;font-weight:800}.coin img{width:25px;height:25px;image-rendering:pixelated}.menu-btn{background:var(--gold);color:#17180e;border-radius:12px;width:44px;height:44px;font-size:24px;font-weight:900;box-shadow:0 4px 0 #8d7b08;transition:transform .2s}.menu-btn:active{transform:translateY(3px);box-shadow:none}.menu{overflow:hidden;max-height:0;opacity:0;transform:translateY(-10px);transition:max-height .38s ease,opacity .25s ease,transform .38s ease;margin-top:0}.menu.open{max-height:400px;opacity:1;transform:translateY(0);margin:4px 0 16px}.menu-inner{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.nav{background:var(--panel2);border:1px solid transparent;padding:13px 12px;border-radius:11px;text-align:left;font-weight:700;transition:.2s}.nav:hover,.nav.active{border-color:var(--gold);background:#30301b}.nav.admin{color:var(--gold)}.hero{border:1px solid #4b4a20;background:linear-gradient(120deg,#30321b,#1a1d15 68%);border-radius:20px;padding:22px;position:relative;overflow:hidden;margin:12px 0 20px}.hero:after{content:"";position:absolute;width:170px;height:170px;right:-20px;top:-35px;background:var(--gold);opacity:.07;transform:rotate(25deg);border:16px solid #f5df32}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.hero h1{font:clamp(27px,6vw,42px) 'Russo One';margin:10px 0}.hero p{color:#c3c7b5;max-width:560px;line-height:1.6;margin-bottom:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 12px}.section-head h2{font:20px 'Russo One';margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:linear-gradient(150deg,#20251b,#171a14);border:1px solid var(--line);border-radius:16px;padding:13px;min-width:0}.case-card{text-align:center;display:flex;flex-direction:column;align-items:stretch;gap:9px}.case-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:#2a2e20;border:1px solid #454b31;image-rendering:pixelated}.case-title{font-weight:800}.case-timer{color:var(--muted);font-size:12px;min-height:16px}.btn{background:var(--gold);color:#15160e;border-radius:10px;padding:11px 14px;font-weight:900;box-shadow:0 3px 0 #9e8a09;transition:filter .2s,transform .2s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px);box-shadow:none}.btn.secondary{background:#303727;color:var(--text);box-shadow:none;border:1px solid #454d39}.btn.danger{background:#512a25;color:#ffd9d4;box-shadow:none}.btn.small{padding:8px 10px;font-size:12px}.full{width:100%}.item-image{width:100%;aspect-ratio:1;object-fit:cover;background:#2c3022;border-radius:10px;border:1px solid var(--line);image-rendering:pixelated}.item-name{font-weight:800;margin:10px 0 5px;overflow-wrap:anywhere}.price{color:var(--gold);font-weight:800}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid #414832;background:#11140f;color:var(--text);border-radius:10px;padding:12px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}.field textarea{min-height:85px;resize:vertical}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}.notice{padding:12px 14px;background:#292c1b;border:1px solid #575022;color:#f5e99b;border-radius:12px;font-size:13px;line-height:1.5;margin:12px 0}.empty{text-align:center;padding:30px 15px;color:var(--muted);border:1px dashed #444b36;border-radius:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{padding:9px 12px;background:#252a20;border:1px solid var(--line);border-radius:9px;font-weight:700;font-size:12px}.tab.active{border-color:var(--gold);color:var(--gold)}.ticket{display:flex;flex-direction:column;gap:8px}.ticket-top{display:flex;justify-content:space-between;gap:8px}.pill{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;padding:5px 7px;border-radius:6px;background:#333a2a;color:#c5d1b5}.pill.open{background:#493e13;color:#ffe76c}.pill.closed{background:#343833;color:#aab0a3}.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:8px 0}.msg{padding:10px 12px;border-radius:12px;background:#292e23;max-width:88%;align-self:flex-start;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#454019}.msg small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.userbar{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:12px;background:#383c24;display:grid;place-items:center;font-weight:900;color:var(--gold)}.hidden{display:none!important}.footer{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#10120eeb;border-top:1px solid #282d22;backdrop-filter:blur(12px);text-align:center;color:#777e6a;font-size:11px;z-index:3}.toast{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);background:#f4d51d;color:#15160e;font-weight:800;padding:12px 16px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0008;max-width:90%;text-align:center}.spinner{width:22px;height:22px;border:3px solid #4c4d2e;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:700px){#app{padding:18px 22px 90px}.menu-inner{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:30px}.grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}@media(max-width:380px){.brand{font-size:18px}.coin{padding:7px}.two{grid-template-columns:1fr}}
</style></head>
<body><div id="app">
<header class="top"><div class="brand"><span>▰</span> ZOMBIX<span>UP</span></div><div class="row"><div class="coin"><img id="goldIcon" alt="Золото"><span id="goldCount">—</span></div><button class="menu-btn" id="menuBtn" aria-label="Открыть меню">☰</button></div></header>
<nav class="menu" id="menu"><div class="menu-inner" id="menuInner"></div></nav>
<main id="view"><div class="panel">Подключение...</div></main>
</div><div class="footer">ZombixUp · Telegram Mini App</div><div id="toast" class="toast hidden"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="./app.js"></script></body></html>
