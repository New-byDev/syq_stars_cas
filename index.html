<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Star App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --panel2:#fafaf8; --text:#141414;
  --muted:#8a8a86; --border:#e4e4e0; --accent:#141414; --accent-text:#ffffff;
}
body[data-theme="dark"]{
  --bg:#141414; --panel:#1e1e1e; --panel2:#232323; --text:#f2f2f0;
  --muted:#9a9a96; --border:#31312e; --accent:#f2f2f0; --accent-text:#141414;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top); overscroll-behavior:none;
}
#appHeader{
  position:sticky; top:0; z-index:50;
  background:#101010; color:#fff;
  height:56px; display:flex; align-items:center;
  padding:0 16px 0 max(16px, env(safe-area-inset-left));
}
#appHeader .brand{font-weight:700; letter-spacing:.4px; font-size:17px}
#menuBtn{
  margin-left:auto; width:42px; height:42px; border-radius:50%;
  border:none; background:#fff; color:#101010;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  cursor:pointer; transition:transform .25s;
}
#menuBtn:active{transform:scale(.9)}
#menuBtn svg{transition:transform .3s}
body.menu-open #menuBtn svg{transform:rotate(90deg)}
#panelClip{
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows .45s cubic-bezier(.22,1,.36,1);
  position:sticky; top:56px; z-index:40;
}
body.menu-open #panelClip{grid-template-rows:1fr}
#menuPanel{
  overflow:hidden; min-height:0;
  background:var(--panel); border-bottom:1px solid var(--border);
  box-shadow:0 12px 24px rgba(0,0,0,.08);
  transform:translateY(-14px); opacity:0;
  transition:transform .45s cubic-bezier(.22,1,.36,1), opacity .3s;
}
body.menu-open #menuPanel{transform:translateY(0); opacity:1}
.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px}
.menu-item{
  display:flex; align-items:center; gap:10px;
  padding:12px; border-radius:14px;
  border:1px solid var(--border); background:var(--panel2);
  color:var(--text); font-size:15px; font-weight:600;
  cursor:pointer; transition:transform .15s; text-align:left;
}
.menu-item:active{transform:scale(.97)}
.menu-item .mi-icon{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:var(--accent); color:var(--accent-text);
  display:flex; align-items:center; justify-content:center; font-size:17px;
}
.menu-item .chev{margin-left:auto; opacity:.4}
.menu-item.full{grid-column:1 / -1}
.menu-item.active{background:var(--accent); color:var(--accent-text)}
#content{padding:16px; padding-bottom:40px; max-width:640px; margin:0 auto}
.page{display:none; animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
h2{font-size:20px; margin:6px 0 14px}
.card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px}
.muted{color:var(--muted); font-size:13px}
.stat{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px}
.stat:last-child{border-bottom:none}
.stat b{font-size:16px}
.tag{
  display:inline-block; margin:2px 4px 2px 0; padding:4px 10px;
  border:1px solid var(--border); border-radius:20px;
  background:var(--panel2); font-size:12px; font-weight:600;
}
.ann-card{
  background:var(--accent); color:var(--accent-text);
  border-radius:16px; padding:16px; margin-bottom:12px;
}
.ann-card .muted{color:inherit; opacity:.6}
/* ===== ОБЛОЖКИ КЕЙСОВ: квадрат с заглушкой ===== */
#casesGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.tile{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:10px; display:flex; flex-direction:column;
}
.tile-img{ /* заглушка под картинку — квадрат 1:1 */
  width:100%; aspect-ratio:1/1; border-radius:12px;
  background:var(--panel2); border:1px dashed var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:48px; margin-bottom:8px;
  position:relative;
}
.tile-img .badge-stock{ /* «Осталось N» прямо на картинке */
  position:absolute; top:6px; left:6px;
  background:var(--accent); color:var(--accent-text);
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px;
}
.tile-img .badge-time{ /* «до закрытия» прямо на картинке */
  position:absolute; top:6px; right:6px;
  background:#c0392b; color:#fff;
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px;
}
.tile-name{font-weight:700; font-size:14px; margin-bottom:2px}
.tile-status{font-size:12px; color:var(--muted); min-height:16px; margin-bottom:6px}
.tile .btn{margin-top:auto; padding:10px; font-size:14px}
.btn{
  width:100%; padding:14px; border-radius:14px; border:none;
  background:var(--accent); color:var(--accent-text);
  font-size:16px; font-weight:700; cursor:pointer; margin-top:8px;
}
.btn.ghost{background:transparent; border:1.5px solid var(--border); color:var(--text)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border)}
.row:last-of-type{border-bottom:none}
.switch{position:relative; width:52px; height:30px; flex:none}
.switch input{opacity:0; width:0; height:0}
.slider{position:absolute; inset:0; border-radius:30px; background:var(--border); cursor:pointer; transition:background .25s}
.slider::before{
  content:''; position:absolute; width:24px; height:24px; border-radius:50%;
  left:3px; top:3px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.switch input:checked + .slider{background:#141414}
body[data-theme="dark"] .switch input:checked + .slider{background:#f2f2f0}
.switch input:checked + .slider::before{transform:translateX(22px)}
#nickInput{
  width:100%; font-size:18px; font-weight:700; color:var(--text);
  background:transparent; border:none; border-bottom:1.5px dashed var(--border);
  padding:4px 0; outline:none;
}
#nickInput:focus{border-bottom-color:var(--text)}
.danger{color:#c0392b}
#invGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.inv-card{border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--panel2); font-size:13px}
.inv-card .p-ico{font-size:26px}
.inv-card .claim-btn{
  margin-top:10px; width:100%; padding:8px; border-radius:10px;
  border:none; background:var(--accent); color:var(--accent-text);
  font-size:13px; font-weight:700; cursor:pointer;
}
#overlay{position:fixed; inset:0; z-index:100; display:none; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:20px}
#overlay.on{display:flex}
#caseModal{background:var(--panel); border-radius:20px; width:100%; max-width:420px; max-height:86vh; overflow-y:auto; padding:20px; animation:fade .3s ease}
#stripView{overflow:hidden; border-radius:12px; border:1px solid var(--border); margin:16px 0; position:relative}
#stripView::before,#stripView::after{
  content:''; position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:2;
}
#stripView::before{left:50%; transform:translateX(-1px)}
#strip{display:flex; will-change:transform}
.prize-cell{flex:none; width:96px; margin:6px 4px; padding:14px 4px; border:1px solid var(--border); border-radius:12px; text-align:center; font-size:13px; background:var(--panel2)}
.prize-cell .p-ico{font-size:24px; display:block; margin-bottom:6px}
.prize-cell.hl{outline:2px solid var(--accent)}
.a-input{
  width:100%; padding:10px 12px; border-radius:10px; margin-bottom:8px;
  border:1.5px solid var(--border); background:var(--panel2);
  color:var(--text); font-size:15px; outline:none;
}
.a-input:focus{border-color:var(--text)}
textarea.a-input{min-height:100px; resize:vertical; font-family:inherit}
.a-btn{
  padding:8px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); font-size:14px;
  font-weight:600; cursor:pointer; margin:4px 6px 0 0;
}
.a-btn.del{border-color:#c0392b; color:#c0392b}
.a-case{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border); font-size:14px}
.a-case .a-info{flex:1; min-width:0}
.a-case .a-sub{font-size:11px; color:var(--muted)}
.a-case .a-actions{white-space:nowrap}
#cloudStatus{font-size:12px; padding:6px 10px; border-radius:8px; background:var(--panel2); border:1px dashed var(--border); margin-bottom:12px}
</style>
</head>
<body>

<header id="appHeader">
  <span class="brand">STAR APP</span>
  <button id="menuBtn" aria-label="Меню">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
</header>

<div id="panelClip">
  <nav id="menuPanel">
    <div class="menu-grid">
      <button class="menu-item" data-page="profile"><span class="mi-icon">👤</span> Профиль <span class="chev">›</span></button>
      <button class="menu-item active" data-page="home"><span class="mi-icon">🏠</span> Главная <span class="chev">›</span></button>
      <button class="menu-item full" data-page="inventory"><span class="mi-icon">📦</span> Инвентарь <span class="chev">›</span></button>
      <button class="menu-item full" data-page="settings"><span class="mi-icon">⚙️</span> Настройки</button>
    </div>
  </nav>
</div>

<main id="content">

  <!-- ГЛАВНАЯ: объявление + сетка квадратных обложек -->
  <section class="page on" id="page-home">
    <h2>Главная</h2>
    <div id="cloudStatus">☁️ Подключаемся к Firebase...</div>
    <div id="annSlot"></div>          <!-- сюда рендерится объявление -->
    <div class="card">
      <b id="homeGreet">Привет!</b>
      <div class="stat" style="margin-top:8px"><span>⭐ Баланс</span><b id="homeStars">0</b></div>
    </div>
    <div id="casesGrid"></div>
  </section>

  <!-- ПРОФИЛЬ -->
  <section class="page" id="page-profile">
    <h2>Профиль</h2>
    <div class="card">
      <div class="muted" style="margin-bottom:6px">Никнейм</div>
      <input id="nickInput" maxlength="20" placeholder="Ваш ник">
    </div>
    <div class="card">
      <div class="stat"><span>⭐ Баланс звёзд</span><b id="statStars">0</b></div>
      <div class="stat"><span>📦 Предметов</span><b id="statItems">0</b></div>
    </div>
  </section>

  <!-- ИНВЕНТАРЬ -->
  <section class="page" id="page-inventory">
    <h2>Инвентарь</h2>
    <div id="invGrid"></div>
    <p class="muted" id="invEmpty" style="text-align:center;margin-top:20px">Пока пусто — откройте кейс на главной 🎁</p>
  </section>

  <!-- НАСТРОЙКИ -->
  <section class="page" id="page-settings">
    <h2>Настройки</h2>
    <div class="card">
      <div class="row">
        <span>🌙 Тёмная тема</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="card" id="adminCard">
      <b>🛠 Админ-панель</b>
      <div id="adminPanel" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div class="row" style="border:none;padding-bottom:0">
        <span>Сброс прогресса</span>
        <button class="btn ghost danger" id="resetBtn" style="width:auto;padding:8px 16px;margin:0">Сбросить</button>
      </div>
    </div>
  </section>

</main>

<!-- МОДАЛКА КЕЙСА: сначала шансы + кнопка «Открыть за N», потом рулетка -->
<div id="overlay">
  <div id="caseModal">
    <div id="caseMenu">
      <b style="font-size:18px" id="modalTitle">🎁 Кейс</b>
      <p class="muted" style="margin:6px 0 12px">Призы и шансы:</p>
      <div id="prizeList"></div>
      <button class="btn" id="openBtn">Открыть</button>      <!-- «Открыть за N ⭐» / «Открыть бесплатно» -->
      <button class="btn ghost" id="closeMenuBtn">Закрыть</button>
    </div>
    <div id="caseSpin" style="display:none">
      <b style="font-size:18px">Крутим...</b>
      <div id="stripView"><div id="strip"></div></div>
      <div id="spinResult" style="text-align:center;font-weight:700;min-height:24px;margin-bottom:8px"></div>
      <button class="btn ghost" id="closeSpinBtn" style="display:none">Забрать и закрыть</button>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   СЮДА ВСТАВИТЬ КОНФИГ — Project settings → Your apps
   ================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB9uAa0NjkxMvjK0ZrGGHBtksWWRZA2cPs",
  authDomain: "syq-site.firebaseapp.com",
  databaseURL: "https://syq-site-default-rtdb.firebaseio.com",
  projectId: "syq-site",
  storageBucket: "syq-site.firebasestorage.app",
  messagingSenderId: "309704145783",
  appId: "1:309704145783:web:3d525163e0fbb1f7723f72",
  measurementId: "G-QV7MG6M9V4"
};

/* ---------- АДМИН ---------- */
const ADMIN_ID   = 8158896250;   // ваш Telegram ID
const ADMIN_CODE = 'admin123';   // резервный вход кодом

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const haptic = t => { try { if (tg) tg.HapticFeedback.impactOccurred(t); } catch(e){} };

/* ==================================================================
   КОНФИГУРАЦИЯ КЕЙСОВ (дефолт — заливается в Firebase, если база пуста)
   Поля кейса:
     id     — уникальное число
     ico    — эмодзи на заглушке обложки
     name   — название
     desc   — описание (видно в окне с шансами)
     cd     — кулдаун в СЕКУНДАХ между открытиями
     price  — цена в звёздах (0 = бесплатный)
     stock  — ЛИМИТ ОТПУСКОВ НА ВСЕХ (0 = без лимита).
              Счётчик живёт в Firebase: caseStock/<id>
     hours  — срок жизни кейса в ЧАСАХ с момента публикации (0 = бессрочно)
     prizes — [{name, chance, type:'stars'|'item', value}]
   ================================================================== */
const DEF_CASES = [{
  id: 1, ico: '🎁', name: 'Стартовый кейс', desc: 'Бесплатный кейс для новичков',
  cd: 60, price: 0, stock: 0, hours: 0,
  prizes: [
    {name:'25 звёзд',    chance:40, type:'stars', value:25},
    {name:'100 звёзд',   chance:30, type:'stars', value:100},
    {name:'250 звёзд',   chance:15, type:'stars', value:250},
    {name:'500 звёзд',   chance:10, type:'stars', value:500},
    {name:'Подарок 🏆',  chance:5,  type:'item',  value:'🏆'}
  ]
}];

/* ---------- ЛОКАЛЬНОЕ СОСТОЯНИЕ ---------- */
const DEF = {nick:'', theme:'light', admin:false, stars:0, items:[], cases:DEF_CASES, lastFree:{}};
let S = {...DEF};
try { S = {...DEF, ...JSON.parse(localStorage.getItem('starApp') || '{}')}; } catch(e){}
const saveLocal = () => localStorage.setItem('starApp', JSON.stringify(S));
const save = () => { saveLocal(); if (USER_REF){ clearTimeout(pushTimer); pushTimer = setTimeout(pushUser, 300); } };
if (S.theme === 'dark') document.body.dataset.theme = 'dark';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtLeft = ms => { /* «1ч 05м» / «4м» / «30 с» для таймеров */
  const s = Math.max(0, Math.ceil(ms/1000));
  if (s >= 3600) return Math.floor(s/3600) + 'ч ' + Math.floor(s%3600/60) + 'м';
  if (s >= 60)   return Math.floor(s/60) + 'м';
  return s + ' с';
};

/* ==================================================================
   FIREBASE: ИНИЦИАЛИЗАЦИЯ И ПОДПИСКИ
   Ветки базы:
     users/<ключ>/       — личные данные (nick, stars, items, lastFree)
     cases/              — общий список кейсов (правит админ)
     caseStock/<id>/     — ОСТАТОК лимитированных кейсов (общий для всех)
     announcement/       — текущее объявление (одно; новое заменяет старое)
   ================================================================== */
let USER_REF = null, cloudReady = false, pushTimer = null;

const fbApp = firebase.initializeApp(firebaseConfig);
const db    = firebase.database();

function pushUser(){
  if (!USER_REF) return;
  USER_REF.set({ nick:S.nick, stars:S.stars, items:S.items, lastFree:S.lastFree })
    .catch(e => setCloudStatus('⚠️ Ошибка записи: ' + e.code));
}
function setCloudStatus(t){ document.getElementById('cloudStatus').textContent = t; }

async function initCloud(){
  try{
    await firebase.auth().signInAnonymously();
    const uid = firebase.auth().currentUser.uid;
    const key = tgUser ? 'tg' + tgUser.id : 'a' + uid.replace(/[^a-zA-Z0-9]/g,'');
    USER_REF = db.ref('users/' + key);

    const snap = await USER_REF.get();
    if (snap.exists()){
      const d = snap.val();
      S.nick = d.nick || ''; S.stars = d.stars || 0;
      S.items = Array.isArray(d.items) ? d.items : [];
      S.lastFree = d.lastFree || {};
      saveLocal();
    } else pushUser();

    /* общий список кейсов; если база пуста — заливаем дефолтные */
    const cs = await db.ref('cases').get();
    if (cs.exists() && cs.val()) S.cases = Object.values(cs.val());
    else await db.ref('cases').set(DEF_CASES);

    cloudReady = true;
    setCloudStatus('☁️ Данные синхронизированы');

    /* живые подписки: кейсы, остатки лимитов, объявление, личные данные */
    db.ref('cases').on('value', s => {
      S.cases = s.exists() ? Object.values(s.val()) : DEF_CASES;
      saveLocal(); renderAll();
    });
    db.ref('caseStock').on('value', s => { S.stockLive = s.val() || {}; renderCases(); });
    db.ref('announcement').on('value', s => { S.ann = s.val() || null; renderAnn(); });
    USER_REF.on('value', s => {
      if (!s.exists()) return;
      const d = s.val();
      S.nick = d.nick || ''; S.stars = d.stars || 0;
      S.items = Array.isArray(d.items) ? d.items : [];
      S.lastFree = d.lastFree || {};
      saveLocal(); nickInput.value = S.nick; renderAll();
    });
  } catch(e){
    setCloudStatus('⚠️ Firebase недоступен — работаем локально (' + e.code + ')');
  }
  renderAll();
}

if (tgUser && tgUser.id === ADMIN_ID) { S.admin = true; saveLocal(); }

/* ==================================================================
   МЕНЮ И НАВИГАЦИЯ
   ================================================================== */
document.getElementById('menuBtn').addEventListener('click', () => {
  document.body.classList.toggle('menu-open'); haptic('light');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-open'); });

const pages = document.querySelectorAll('.page');
document.querySelectorAll('.menu-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = btn.dataset.page;
    pages.forEach(pg => pg.classList.toggle('on', pg.id === 'page-' + p));
    document.querySelectorAll('.menu-item').forEach(b => b.classList.toggle('active', b === btn));
    document.body.classList.remove('menu-open');
    window.scrollTo({top:0, behavior:'smooth'});
    renderAll();
  });
});

/* ==================================================================
   ГЛАВНАЯ: ОБЛОЖКИ КЕЙСОВ (без шансов — только картинка, бейджи, кнопка)
   ================================================================== */
function renderCases(){
  document.getElementById('casesGrid').innerHTML = S.cases.map(c => {
    const ended = c.hours && c.endsAt && Date.now() > c.endsAt;
    const stock = S.stockLive && S.stockLive[c.id];
    return '<div class="tile">' +
      /* квадратная заглушка под картинку + иконка */
      '<div class="tile-img">' + esc(c.ico) +
        (stock !== undefined && stock !== null ? '<span class="badge-stock">Осталось ' + stock + '</span>' : '') +
        (c.hours ? '<span class="badge-time">⏰</span>' : '') +
      '</div>' +
      '<div class="tile-name">' + esc(c.name) + '</div>' +
      /* статус: кулдаун / время жизни — обновляется tickFree */
      '<div class="tile-status" id="cd-' + c.id + '"></div>' +
      /* кнопка «Открыть» — шансы покажутся в следующем окне */
      '<button class="btn" onclick="openCase(' + c.id + ')" ' + (ended ? 'disabled' : '') + '>Открыть</button>' +
    '</div>';
  }).join('');
  tickFree();
}

/* Таймеры обложек: раз в полсекунды обновляет кулдаун и срок жизни */
function tickFree(){
  S.cases.forEach(c => {
    const el = document.getElementById('cd-' + c.id);
    if (!el) return;
    if (c.endsAt && Date.now() > c.endsAt){
      el.textContent = '⛔ Время вышло';
    } else {
      const left = (S.lastFree[c.id] || 0) + (c.cd || 60) * 1000 - Date.now();
      el.textContent = left > 0
        ? '⏳ Доступно через ' + fmtLeft(left)
        : (c.endsAt ? '✅ Доступен · закроется через ' + fmtLeft(c.endsAt - Date.now()) : '✅ Доступен');
    }
  });
  setTimeout(tickFree, 500);
}

/* ==================================================================
   ОБЪЯВЛЕНИЕ НА ГЛАВНОЙ (одно; новое заменяет старое автоматически)
   ================================================================== */
function renderAnn(){
  document.getElementById('annSlot').innerHTML = S.ann && S.ann.text
    ? '<div class="ann-card"><b>📢 Объявление</b><p style="margin-top:6px;white-space:pre-wrap">' + esc(S.ann.text) + '</p>' +
      '<p class="muted">' + esc(S.ann.date || '') + '</p></div>'
    : '';
}

/* ==================================================================
   МОДАЛКА КЕЙСА
   ================================================================== */
const overlay = document.getElementById('overlay');
let currentCase = null;

/* «Открыть» на обложке: показывает окно с шансами и ценой */
window.openCase = id => {
  const c = S.cases.find(x => x.id === id);
  if (!c) return;
  if (c.endsAt && Date.now() > c.endsAt) return alert('Время акции вышло');
  currentCase = c;
  document.getElementById('modalTitle').textContent = c.ico + ' ' + c.name;
  document.getElementById('prizeList').innerHTML = c.prizes.map(p =>
    '<div class="case-item" style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px">' +
      '<span>' + esc(p.name) + '</span><b style="color:var(--muted)">' + p.chance + '%</b></div>'
  ).join('');
  /* кнопка с ценой: «Открыть за N ⭐» или «Открыть бесплатно» */
  document.getElementById('openBtn').textContent =
    c.price > 0 ? 'Открыть за ' + c.price + ' ⭐' : 'Открыть бесплатно';
  overlay.classList.add('on'); haptic('medium');
};

document.getElementById('closeMenuBtn').addEventListener('click', closeCase);
document.getElementById('closeSpinBtn').addEventListener('click', closeCase);
overlay.addEventListener('click', e => { if (e.target === overlay) closeCase(); });

function closeCase(){
  overlay.classList.remove('on');
  document.getElementById('caseSpin').style.display = 'none';
  document.getElementById('closeSpinBtn').style.display = 'none';
  document.getElementById('spinResult').textContent = '';
}

/* Выбор приза по накопленным шансам */
function spinPrize(caseObj){
  let r = Math.random() * 100, acc = 0;
  for (const p of caseObj.prizes){ acc += p.chance; if (r <= acc) return p; }
  return caseObj.prizes[0];
}

/* Кнопка «Открыть за N ⭐» в окне шансов: все проверки, списание, запуск */
document.getElementById('openBtn').addEventListener('click', async () => {
  const c = currentCase;
  if (!c) return;
  if (c.endsAt && Date.now() > c.endsAt) return alert('Время акции вышло');

  const left = (S.lastFree[c.id] || 0) + (c.cd || 60) * 1000 - Date.now();
  if (left > 0) return alert('Подождите ' + Math.ceil(left/1000) + ' с');

  if (c.price > 0 && S.stars < c.price)
    return alert('Не хватает звёзд: нужно ' + c.price + ', у вас ' + S.stars);

  /* остаток лимитированного кейса: читаем общий счётчик из Firebase */
  let stock = null;
  if (cloudReady){
    try { const s = await db.ref('caseStock/' + c.id).get(); if (s.exists()) stock = s.val(); } catch(e){}
  }
  if (stock !== null && stock <= 0) return alert('Этот кейс закончился 😢');

  /* списываем цену, фиксируем кулдаун, уменьшаем общий остаток */
  if (c.price > 0) S.stars -= c.price;
  S.lastFree[c.id] = Date.now();
  if (stock !== null) db.ref('caseStock/' + c.id).set(stock - 1).catch(()=>{});
  save(); tickFree();
  haptic('rigid');

  startSpin(c);
});

/* Прокрутка ленты: генерирует ячейки, докручивает до выигрышной, выдаёт приз */
function startSpin(c){
  document.getElementById('caseMenu').style.display = 'none';
  document.getElementById('caseSpin').style.display = '';
  const prize = spinPrize(c);
  const strip = document.getElementById('strip');
  const cells = [];
  const N = 42, WIN = 34;
  for (let i = 0; i < N; i++){
    const p = c.prizes[Math.floor(Math.random() * c.prizes.length)];
    const d = document.createElement('div');
    d.className = 'prize-cell';
    d.innerHTML = '<span class="p-ico">' + esc(p.type === 'item' ? p.value : '⭐') + '</span>' + esc(p.name);
    strip.appendChild(d); cells.push(d);
  }
  cells[WIN].innerHTML = '<span class="p-ico">' + esc(prize.type === 'item' ? prize.value : '⭐') + '</span>' + esc(prize.name);

  strip.style.transition = 'none'; strip.style.transform = 'translateX(0)';
  const cw = 104;
  const view = document.getElementById('stripView').offsetWidth;
  const offset = WIN * cw + cw/2 - view/2;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    strip.style.transition = 'transform 4.2s cubic-bezier(.15,.9,.2,1)';
    strip.style.transform = 'translateX(-' + offset + 'px)';
  }));

  setTimeout(() => {
    cells[WIN].classList.add('hl');
    document.getElementById('spinResult').textContent = '🎉 Выпало: ' + prize.name + ' — отправлено в инвентарь!';
    haptic('heavy');
    S.items.unshift({
      name: prize.name,
      ico: prize.type === 'item' ? prize.value : '⭐',
      type: prize.type,
      stars: prize.type === 'stars' ? prize.value : 0,
      date: new Date().toLocaleDateString()
    });
    save(); renderAll();
    document.getElementById('closeSpinBtn').style.display = '';
    strip.style.transition = ''; strip.innerHTML = '';
    cells[WIN].classList.remove('hl');
  }, 4400);
}

/* ==================================================================
   ИНВЕНТАРЬ
   ================================================================== */
function renderInv(){
  const g = document.getElementById('invGrid');
  g.innerHTML = S.items.map((it, i) =>
    '<div class="inv-card">' +
      '<span class="p-ico">' + esc(it.ico) + '</span>' +
      '<div><b>' + esc(it.name) + '</b></div>' +
      '<span class="muted">' + esc(it.date) + '</span>' +
      (it.type === 'stars'
        ? '<button class="claim-btn" onclick="claimStars(' + i + ')">Забрать ' + it.stars + ' ⭐</button>'
        : '') +
    '</div>'
  ).join('');
  document.getElementById('invEmpty').style.display = S.items.length ? 'none' : '';
}

/* «Забрать»: зачисляет звёзды и удаляет карточку из инвентаря */
window.claimStars = i => {
  const it = S.items[i];
  if (!it || it.type !== 'stars') return;
  S.stars += it.stars;
  S.items.splice(i, 1);
  save(); renderAll(); haptic('heavy');
};

/* ==================================================================
   ПРОФИЛЬ И НАСТРОЙКИ
   ================================================================== */
const nickInput = document.getElementById('nickInput');
nickInput.value = S.nick;
nickInput.addEventListener('input', () => { S.nick = nickInput.value.trim(); save(); renderHome(); });
nickInput.addEventListener('keydown', e => { if (e.key === 'Enter') nickInput.blur(); });

const themeToggle = document.getElementById('themeToggle');
themeToggle.checked = S.theme === 'dark';
themeToggle.addEventListener('change', () => {
  S.theme = themeToggle.checked ? 'dark' : 'light';
  document.body.dataset.theme = S.theme === 'dark' ? 'dark' : '';
  saveLocal(); haptic('light');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Сбросить весь прогресс?')) {
    S = {...DEF, theme: S.theme, admin: S.admin};
    save(); nickInput.value = ''; renderAll();
  }
});

/* ==================================================================
   АДМИН-ПАНЕЛЬ: кейсы (цена, лимит, срок) + объявление.
   Формат призов: Название | шанс% | stars/item | значение
   ================================================================== */
let editingId = null;

function renderAdmin(){
  const wrap = document.getElementById('adminPanel');
  if (!S.admin){
    wrap.innerHTML =
      '<p class="muted">Режим администратора выключен.</p>' +
      '<input class="a-input" id="adminCodeInput" placeholder="Код администратора">' +
      '<button class="a-btn" id="adminUnlockBtn">Войти</button>';
    document.getElementById('adminUnlockBtn').onclick = () => {
      if (document.getElementById('adminCodeInput').value === ADMIN_CODE){
        S.admin = true; saveLocal(); renderAdmin();
      } else alert('Неверный код');
    };
    return;
  }

  /* --- секция объявлений --- */
  let html = '<div style="border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:10px">' +
    '<b>📢 Объявление</b>' +
    (S.ann && S.ann.text ? '<p class="muted">Сейчас на главной: «' + esc(S.ann.text) + '»</p>' : '<p class="muted">Сейчас объявления нет.</p>') +
    '<textarea class="a-input" id="annText" placeholder="Текст объявления">' + (S.ann ? esc(S.ann.text) : '') + '</textarea>' +
    '<button class="a-btn" onclick="publishAnn()">Опубликовать (заменит старое)</button>' +
    '<button class="a-btn del" onclick="removeAnn()">Убрать объявление</button>' +
  '</div>';

  /* --- список кейсов с кнопками ✏️ / 🗑 --- */
  html += S.cases.map(c =>
    '<div class="a-case">' +
      '<span>' + esc(c.ico) + '</span>' +
      '<span class="a-info">' + esc(c.name) +
        '<div class="a-sub">' +
          (c.price > 0 ? c.price + ' ⭐ · ' : 'бесплатно · ') +
          (S.stockLive && S.stockLive[c.id] !== undefined ? 'осталось ' + S.stockLive[c.id] + ' · ' : 'без лимита · ') +
          (c.endsAt ? 'до ' + new Date(c.endsAt).toLocaleString() : 'бессрочно') +
        '</div>' +
      '</span>' +
      '<span class="a-actions">' +
        '<button class="a-btn" onclick="editCase(' + c.id + ')">✏️</button>' +
        '<button class="a-btn del" onclick="delCase(' + c.id + ')">🗑</button>' +
      '</span>' +
    '</div>'
  ).join('');

  /* --- форма редактирования кейса --- */
  if (editingId !== null){
    const c = editingId === 'new'
      ? {ico:'🎁', name:'', desc:'', cd:60, price:0, stock:0, hours:0, prizes:[{name:'', chance:0}]}
      : S.cases.find(x => x.id === editingId);
    const hoursLeft = c.endsAt ? Math.max(0, (c.endsAt - Date.now()) / 3600000) : 0;
    html +=
      '<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border)">' +
        '<input class="a-input" id="cIco" placeholder="Иконка (эмодзи)" value="' + esc(c.ico) + '">' +
        '<input class="a-input" id="cName" placeholder="Название кейса" value="' + esc(c.name) + '">' +
        '<input class="a-input" id="cDesc" placeholder="Описание" value="' + esc(c.desc) + '">' +
        '<input class="a-input" id="cPrice" type="number" min="0" placeholder="Цена в звёздах (0 = бесплатно)" value="' + (c.price || 0) + '">' +
        '<input class="a-input" id="cCd" type="number" min="0" placeholder="Кулдаун, сек (60)" value="' + (c.cd || 60) + '">' +
        '<input class="a-input" id="cStock" type="number" min="0" placeholder="Лимит открытий НА ВСЕХ (0 = без лимита)" value="' + (c.stock || 0) + '">' +
        '<input class="a-input" id="cHours" type="number" min="0" step="0.5" placeholder="Срок жизни, часы (0 = бессрочно)" value="' + (c.endsAt ? hoursLeft.toFixed(1) : 0) + '">' +
        '<textarea class="a-input" id="cPrizes" placeholder="Название | шанс% | stars/item | значение">' +
          c.prizes.map(p => p.name + ' | ' + p.chance + ' | ' + p.type + ' | ' + p.value).join('\n') +
        '</textarea>' +
        '<button class="a-btn" onclick="saveCase()">Сохранить</button>' +
        '<button class="a-btn" onclick="cancelEdit()">Отмена</button>' +
      '</div>';
  } else {
    html += '<button class="a-btn" onclick="editCase(\'new\')">＋ Добавить кейс</button>';
  }
  wrap.innerHTML = html;
}

window.editCase  = id => { editingId = id; renderAdmin(); };
window.cancelEdit = () => { editingId = null; renderAdmin(); };

/* 🗑: удаляет кейс и его счётчик остатка из базы */
window.delCase = id => {
  if (!confirm('Удалить кейс? Изменение увидят все пользователи.')) return;
  S.cases = S.cases.filter(c => c.id !== id);
  saveLocal();
  db.ref('cases').set(S.cases).catch(e => alert('Ошибка: ' + e.code));
  db.ref('caseStock/' + id).remove().catch(()=>{});
  renderAll();
};

/* «Сохранить»: пишет кейс в общую базу; при лимите сбрасывает счётчик остатка */
window.saveCase = () => {
  const prizes = document.getElementById('cPrizes').value
    .split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => {
      const p = l.split('|').map(x => x.trim());
      return { name: p[0] || 'Приз', chance: parseFloat(p[1]) || 0,
               type: p[2] === 'item' ? 'item' : 'stars', value: p[3] || '⭐' };
    });
  const price = Math.max(0, parseInt(document.getElementById('cPrice').value) || 0);
  const cd    = Math.max(0, parseInt(document.getElementById('cCd').value) || 0);
  const stock = Math.max(0, parseInt(document.getElementById('cStock').value) || 0);
  const hours = Math.max(0, parseFloat(document.getElementById('cHours').value) || 0);

  const data = {
    ico:  document.getElementById('cIco').value.trim() || '🎁',
    name: document.getElementById('cName').value.trim() || 'Без названия',
    desc: document.getElementById('cDesc').value.trim(),
    cd, price, stock,
    endsAt: hours > 0 ? Date.now() + hours * 3600000 : 0,  // срок жизни считается от момента сохранения
    prizes
  };

  let caseId;
  if (editingId === 'new'){ caseId = Date.now(); S.cases.push({id: caseId, ...data}); }
  else {
    caseId = editingId;
    const c = S.cases.find(x => x.id === caseId);
    if (c) Object.assign(c, data);
  }
  editingId = null;
  saveLocal();
  db.ref('cases').set(S.cases).catch(e => alert('Ошибка: ' + e.code));
  /* счётчик остатка: выставляем заново при сохранении лимитированного кейса */
  if (stock > 0) db.ref('caseStock/' + caseId).set(stock).catch(()=>{});
  else db.ref('caseStock/' + caseId).remove().catch(()=>{});
  renderAll();
};

/* 📢 Опубликовать объявление: одна запись — она и есть «текущее объявление» */
window.publishAnn = () => {
  const text = document.getElementById('annText').value.trim();
  if (!text) return alert('Введите текст объявления');
  db.ref('announcement').set({ text, date: new Date().toLocaleString() })
    .then(() => alert('Опубликовано'))
    .catch(e => alert('Ошибка: ' + e.code));
};

/* 🗑 Убрать объявление: удаляет запись — карточка исчезнет у всех */
window.removeAnn = () => {
  if (!confirm('Убрать объявление с главной?')) return;
  db.ref('announcement').remove()
    .catch(e => alert('Ошибка: ' + e.code));
};

/* ==================================================================
   РЕНДЕР И СТАРТ
   ================================================================== */
function renderHome(){
  document.getElementById('homeGreet').textContent = 'Привет, ' + (S.nick || 'незнакомец') + '!';
}
function renderAll(){
  document.getElementById('statStars').textContent = S.stars;
  document.getElementById('statItems').textContent = S.items.length;
  document.getElementById('homeStars').textContent = S.stars;
  renderHome(); renderCases(); renderInv(); renderAdmin(); renderAnn();
}
renderAll();
initCloud();

if (tg){ try { tg.ready(); tg.expand(); } catch(e){} }
</script>
