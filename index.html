  <style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{--bg:#0a0a0a;--card:#141414;--card2:#1d1d1d;--line:#2a2a2a;--txt:#f2f2f2;--dim:#9a9a9a;--acc:#ffffff}

body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;padding-bottom:30px}

button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;transition:.2s}

input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;outline:none;transition:.2s}

input:focus,textarea:focus{border-color:#555}

.btn{background:var(--acc);color:#000;font-weight:600;padding:12px 16px;font-size:15px}

.btn:active{transform:scale(.96)}

.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}

.btn.red{background:#fff;color:#000}

.btn:disabled{opacity:.4;cursor:default}

img{max-width:100%}

.hidden{display:none!important}



/* header */

#header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.bal{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:7px 14px;border-radius:12px}

.bal img{width:22px;height:22px;object-fit:cover;border-radius:6px}

.bal b{font-size:16px;letter-spacing:.5px}

#menuBtn{background:var(--card);border:1px solid var(--line);color:var(--txt);width:42px;height:42px;font-size:20px;border-radius:12px}



/* menu - плавно выпадает вниз */

#menu{position:fixed;top:calc(66px + env(safe-area-inset-top, 0px));right:12px;z-index:60;width:min(280px,calc(100vw - 24px));background:#101010;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:0;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-10px) scale(.98);transform-origin:top right;transition:max-height .36s cubic-bezier(.22,1,.36,1),opacity .24s ease,transform .36s cubic-bezier(.22,1,.36,1),visibility 0s linear .36s;box-shadow:0 12px 40px rgba(0,0,0,.7)}

#menu.open{max-height: min(75vh, 560px);opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1);transition:max-height .36s cubic-bezier(.22,1,.36,1),opacity .24s ease,transform .36s cubic-bezier(.22,1,.36,1),visibility 0s}

#menu .mi{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s;font-size:15px;display:flex;justify-content:space-between;align-items:center}

#menu .mi:last-child{border-bottom:none}

#menu .mi:active{background:var(--card2)}



/* screens */

#app{padding:14px;animation:fadeIn .3s ease}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h1{font-size:22px;margin:6px 0 14px}

h2{font-size:17px;margin:20px 0 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}

.row{display:flex;gap:10px;align-items:center}

.muted{color:var(--dim);font-size:13px}

.small{font-size:12px;color:var(--dim)}

.grow{flex:1}

.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}

.tab{padding:9px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--dim);white-space:nowrap;font-size:13px}

.tab.act{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}



/* кейс-карточка */

.case-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}

.case-imgwrap{position:relative;padding:10px;display:flex;justify-content:center}

.case-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#000}

.case-name{position:absolute;top:16px;left:16px;right:16px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 6px #000,0 0 3px #000}

.case-timer{position:absolute;bottom:18px;left:16px;background:rgba(0,0,0,.75);padding:3px 9px;border-radius:8px;font-size:11px}

.case-body{padding:0 12px 12px;text-align:center}

.case-buy{width:100%;padding:11px;background:var(--acc);color:#000;font-weight:700;border-radius:12px;font-size:15px}

.case-left{margin-top:7px;font-size:12px;color:var(--dim)}



/* инвентарь */

.item-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}

.item-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}

.item-name{font-size:13px;font-weight:600;margin:8px 0 2px;min-height:16px}

.item-price{font-size:12px;color:var(--dim);margin-bottom:8px}



/* объявления */

.ann{margin-bottom:12px;animation:fadeIn .4s ease}

.ann img{border-radius:12px;margin-top:8px;max-height:260px;object-fit:cover;width:100%}



/* тикеты */

.tick{border-left:3px solid var(--line)}

.tick.open{border-left-color:#fff}

.tick.closed{opacity:.6}

.chat{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}

.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;word-break:break-word}

.msg.me{align-self:flex-end;background:var(--acc);color:#000;border-bottom-right-radius:4px}

.msg.them{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:4px}

.msg .who{font-size:10px;opacity:.6;margin-bottom:2px}



/* модалка */

#modalWrap{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .25s}

#modalWrap.show{opacity:1}

#modal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;transform:scale(.94);transition:transform .25s}

#modalWrap.show #modal{transform:scale(1)}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--acc);color:#000;padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90%;text-align:center}

#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.upg-wheel{height:60px;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;margin:12px 0}

.upg-line{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;z-index:2}

.upg-track{position:absolute;top:10px;height:40px;display:flex;align-items:center;gap:6px;will-change:transform}

.upg-cell{min-width:70px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--line);border-radius:8px;font-size:12px;padding:0 6px}

.login-box{max-width:340px;margin:60px auto;text-align:center}

.login-box input{margin:8px 0}

.avatar{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--card2);border:1px solid var(--line)}

.file-btn{display:block;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:13px;cursor:pointer;margin:6px 0}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;margin:4px 4px 0 0}

.chip button{background:none;color:var(--dim);font-size:14px;padding:0}

.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

.stat:last-child{border-bottom:none}

@media (prefers-reduced-motion: reduce){#menu,#app,.ann,#modal,#modalWrap,#toast{transition:none!important;animation:none!important}}


</style>
</head>

let db, USER = null, CONFIG = {currencyIcon:"", house:{income:0,outcome:0}};

let ANN = {}, ITEMS = {}, CASES = {}, MENU_OPEN = false, CUR_SCREEN = "main";

const $ = s => document.querySelector(s);

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200);}

/* ============ FIREBASE ============ */

function fbInit(){

  firebase.initializeApp(FIREBASE_CONFIG);

  db = firebase.database();

}

const dbGet = p => db.ref(p).get().then(s=>s.val());

const dbSet = (p,v) => db.ref(p).set(v);

const dbUpd = (p,v) => db.ref(p).update(v);

const dbPush = (p,v) => db.ref(p).push(v).then(r=>r.key);



/* изображение -> сжатый base64 */

function pickImage(cb){

  const inp = document.createElement("input");

  inp.type = "file"; inp.accept = "image/*";

  inp.onchange = () => {

    const f = inp.files[0]; if(!f) return;
      if(!f.type.startsWith("image/")) return toast("Выберите изображение");
      if(f.size > 8 * 1024 * 1024) return toast("Изображение должно быть меньше 8 МБ");
      if(!f.type.startsWith("image/")) return toast("Выберите изображение");
      if(f.size > 8 * 1024 * 1024) return toast("Изображение должно быть меньше 8 МБ");

    const r = new FileReader();

    r.onload = () => {

      const img = new Image();

      img.onload = () => {

        const c = document.createElement("canvas");

        const s = Math.min(1, 256/Math.max(img.width,img.height));

        c.width = img.width*s; c.height = img.height*s;

        c.getContext("2d").drawImage(img,0,0,c.width,c.height);

        cb(c.toDataURL("image/jpeg",0.82));

      };

      img.src = r.result;

    };

    r.readAsDataURL(f);

  };

  inp.click();

}

function getTgUser(){

async function ensureUser(tgu){

  const ref = "users/"+tgu.id;

  let data = await dbGet(ref);

  if(!data) await dbSet(ref, {name:tgu.name, tgId:tgu.id, balance:0, role:"player", createdAt:Date.now()});

  data = await dbGet(ref);

  USER = Object.assign({id:tgu.id}, data);

  USER.isAdmin = ADMIN_IDS.map(String).includes(String(USER.id));

  USER.isStaff = USER.isAdmin || USER.role==="moderator";

  db.ref("config").on("value", s=>{ CONFIG = Object.assign({house:{income:0,outcome:0}}, s.val()||{}); renderHeader(); });

}



function renderLogin(){

  $("#header").style.visibility="hidden";

  $("#app").innerHTML = `<div class="login-box">

    <p class="muted" style="margin-bottom:20px">Введите данные для входа</p>

    <input id="inId" placeholder="${L.loginId}" inputmode="numeric">

    <input id="inName" placeholder="${L.loginName}">

    <button class="btn" style="width:100%;margin-top:12px" onclick="manualLogin()">${L.loginBtn}</button>

  </div>`;

}

async function manualLogin(){
  const id = $("#inId").value.trim();
  const name = $("#inName").value.trim() || ("id" + id);
  if (!id || !/^\d+$/.test(id)) return toast(L.errFill);
  try {
    await ensureUser({id, name});
    localStorage.setItem("zxu_id", id);
    localStorage.setItem("zxu_name", name);
    startApp();
  } catch (err) {
    toast("Не удалось подключиться к Firebase");
    console.error(err);
  }
}

function renderHeader(){

  $("#curIconImg").src = ic; $("#curIconImg").style.visibility = USER ? "visible":"hidden";

function defaultGoldIcon(){

  return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23fff' stroke='%23000' stroke-width='3'/><text x='32' y='42' font-size='28' text-anchor='middle' fill='%23000' font-family='Arial' font-weight='bold'>G</text></svg>`);

}



function toggleMenu(e){
  if (e) e.stopPropagation();
  MENU_OPEN = !MENU_OPEN;
  $("#menu").classList.toggle("open", MENU_OPEN);
  $("#menuBtn").setAttribute("aria-expanded", String(MENU_OPEN));
}
document.addEventListener("click", e => {
  if (MENU_OPEN && !$("#menu").contains(e.target) && e.target.id !== "menuBtn") {
    MENU_OPEN = false;
    $("#menu").classList.remove("open");
    $("#menuBtn").setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && MENU_OPEN) {
    MENU_OPEN = false;
    $("#menu").classList.remove("open");
    $("#menuBtn").setAttribute("aria-expanded", "false");
  }
});

function buildMenu(){

  const items = [

    ["main", L.menuMain], ["inventory", L.menuInv], ["upgrader", L.menuUpg],

    ["profile", L.menuProfile], ["settings", L.menuSet]

  ];

  if(USER.isStaff) items.push(["tickets", L.menuTickets]);

  if(USER.isAdmin) items.push(["admin", L.menuAdmin]);

  $("#menu").innerHTML = items.map(([k,t])=>`<div class="mi" onclick="go('${k}')">${t}<span>›</span></div>`).join("");

}



function go(scr){

  MENU_OPEN = false; $("#menu").classList.remove("open");

  CUR_SCREEN = scr;

  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }

  if(curTicket) db.ref("tickets/"+curTicket+"/msgs").off();

  buildMenu();

  const r = {main:renderMain, inventory:renderInventory, upgrader:renderUpgrader, profile:renderProfile, settings:renderSettings, tickets:renderTickets, admin:renderAdmin};

  (r[scr]||renderMain)();

  window.scrollTo(0,0);

}



/* ============ ГЛАВНАЯ (объявления + кейсы) ============ */

async function renderMain(){

  const [ann, cases] = await Promise.all([dbGet("announcements")||Promise.resolve({}), dbGet("cases")||Promise.resolve({})]);

  ANN = ann||{}; CASES = cases||{};

  const annHtml = Object.values(ANN).sort((a,b)=>b.ts-a.ts).map(a=>

    `<div class="card ann">${a.text?`<div>${esc(a.text).replace(/\n/g,"<br>")}</div>`:""}${a.image?`<img src="${a.image}">`:""}</div>`

  ).join("");



  const now = Date.now();

  const active = Object.entries(CASES).filter(([id,c])=>!c.expiresAt || c.expiresAt>now);

  const caseHtml = active.length ? `<div class="grid" id="caseGrid">${active.map(([id,c])=>caseCard(id,c)).join("")}</div>` : `<p class="muted">${L.noData}</p>`;



  $("#app").innerHTML = `<h1>${L.mainTitle}</h1>${annHtml||""}<h2>${L.adminCases}</h2>${caseHtml}`;

  startCountdowns();

}



function startCountdowns(){

  countdownTimer = setInterval(()=>{

    document.querySelectorAll("[data-exp]").forEach(el=>{

      const left = Number(el.dataset.exp) - Date.now();

      if(left<=0){ go(CUR_SCREEN); return; }

      el.textContent = L.closesIn+" "+humanTime(left);

    });

    document.querySelectorAll("[data-cd]").forEach(el=>{

      const left = Number(el.dataset.cd) - Date.now();

      const btn = el.dataset.btn && document.getElementById(el.dataset.btn);

      if(left>0){ el.textContent = L.cooldownLeft+" "+humanTime(left); if(btn) btn.disabled=true; }

      else { el.textContent=""; if(btn){ btn.disabled=false; } }

    });

  },1000);

}

function humanTime(ms){

  const s = Math.floor(ms/1000);

  if(s>=3600) return Math.floor(s/3600)+"ч "+Math.floor(s%3600/60)+"м";

  if(s>=60) return Math.floor(s/60)+"м "+(s%60)+"с";

  return s+"с";

}

    const userMaxed = CASES[id].userLimit>0 && st && st.count>=CASES[id].userLimit;

    if(userMaxed){ el.textContent = L.limitReached; if(btn) btn.disabled=true; }

    else if(cdLeft>0){ el.textContent = L.cooldownLeft+" "+humanTime(cdLeft); if(btn) btn.disabled=true; }

    else { el.textContent=""; }

  }

  db.ref("caseOpen").on("value", async ()=>{

    for(const id of Object.keys(CASES)){

      if(!((CASES[id].totalLimit||0) > 0)) continue;

      const total = await dbGet("caseTotal/"+id);

      const el = document.querySelector(`[data-opens="${id}"]`);

}

async function openCase(id){

  const c = CASES[id]; if(!c) return;

  if(c.expiresAt && c.expiresAt < Date.now()) return toast(L.caseExpired);

  const key = "caseOpen/"+id+"_"+USER.id, tKey = "caseTotal/"+id;

  const st = (await dbGet(key))||{count:0,lastOpen:0};

  if(c.userLimit>0 && st.count>=c.userLimit) return toast(L.limitReached);

  const cdLeft = st.lastOpen && c.cooldown>0 ? st.lastOpen + c.cooldown*60000 - Date.now() : 0;

  if(cdLeft>0) return toast(L.cooldownLeft+": "+humanTime(cdLeft));

  if((USER.balance||0) < c.price) return toast(L.notEnough);



  // глобальный лимит через транзакцию

  if(c.totalLimit>0){

    const tRef = db.ref(tKey);

    const res = await tRef.transaction(v => (v||0) >= c.totalLimit ? undefined : (v||0)+1);

    if(!res.committed) return toast(L.limitReached);

  }



  await dbSet(key, {count:(st.count||0)+1, lastOpen:Date.now()});

  await db.ref("users/"+USER.id+"/balance").transaction(v=>(v||0)-c.price);

  await houseAdd("income", c.price);



  // выпадение предмета по весам

  const entries = Object.entries(c.contents||{}).filter(([iid])=>ITEMS[iid]);

  if(!entries.length) return;

  const total = entries.reduce((s,[,w])=>s+Number(w.chance||0),0);

  let r = Math.random()*total, pick = entries[0];

  for(const e of entries){ r -= Number(e[1].chance||0); if(r<=0){ pick = e; break; } }

  const item = ITEMS[pick[0]];

  const inv = {itemId:pick[0], name:item.name, price:Number(item.price), icon:item.icon||"", upg:0, ts:Date.now()};

  const invKey = await dbPush("inventory/"+USER.id, inv);

  openModal(`<h2 style="text-align:center">${L.won}</h2>

    <div style="text-align:center">${icon(item.icon)}<div class="item-name" style="font-size:16px">${esc(item.name)}</div><div class="muted">${fmt(item.price)} ${L.gold}</div></div>

    <button class="btn" style="width:100%;margin-top:14px" onclick="closeModal()">${L.done}</button>`);

  USER.balance -= c.price; renderHeader();

  go("inventory");

}

async function updateUpgPanel(){

  if(!upgSel) return;

  const it = await dbGet("inventory/"+USER.id+"/"+upgSel);

  if(!it) return;

  const ch = (100-HOUSE_EDGE)/upgMult;

  $("#upgChance").textContent = ch.toFixed(2)+"%";

  $("#upgTarget").textContent = fmt(it.price*upgMult)+" "+L.gold;

  if(upgBusy) return;

  const track = $("#upgTrack"); if(!track) return;

  track.innerHTML = "";

  for(let i=0;i<14;i++){

    const win = Math.random()*100 < ch;

    const cell = document.createElement("div");

    cell.className = "upg-cell";

    cell.textContent = win ? "x"+upgMult : "✕";

    cell.style.background = win ? "#fff" : "var(--card2)";

    cell.style.color = win ? "#000" : "var(--dim)";

    track.appendChild(cell);

  }

}

async function doUpg(){

  if(upgBusy || !upgSel) return;

  upgBusy = true;

  const it = await dbGet("inventory/"+USER.id+"/"+upgSel);

  if(!it){ upgBusy=false; return; }

  const ch = (100-HOUSE_EDGE)/upgMult;

  const win = Math.random()*100 < ch;

  const track = $("#upgTrack"), go_ = $("#upgGo");

  go_.disabled = true;

  track.innerHTML = "";

  for(let i=0;i<30;i++){

    const w = Math.random()*100 < ch;

    const cell = document.createElement("div");

    cell.className = "upg-cell";

    cell.textContent = w ? "x"+upgMult : "✕";

    cell.style.background = w ? "#fff" : "var(--card2)";

    cell.style.color = w ? "#000" : "var(--dim)";

    track.appendChild(cell);

  }

  track.style.transition = "none"; track.style.transform = "translateX(0)";

  track.getBoundingClientRect();

  track.style.transition = "transform 3.2s cubic-bezier(.15,.9,.3,1)";

  track.style.transform = "translateX(-" + (track.scrollWidth - 220) + "px)";

  await new Promise(r=>setTimeout(r,3300));

  // честный итог по чансу

  if(win){

    await db.ref("inventory/"+USER.id+"/"+upgSel).remove();

    await dbPush("inventory/"+USER.id, {name:it.name+" ✦x"+upgMult, price:Math.floor(it.price*upgMult), icon:it.icon, upg:(it.upg||0)+1, ts:Date.now()});

    await houseAdd("outcome", Math.floor(it.price*upgMult));

  } else {

    await db.ref("inventory/"+USER.id+"/"+upgSel).remove();

    await houseAdd("income", it.price);

    toast(L.upgLose);

  }

  upgSel = null; upgBusy = false;

  go("inventory");

}

async function takeTicket(id){

  const t = await dbGet("tickets/"+id);

  if(!t || t.takenBy) return toast(L.alreadyTaken);

  if(t.userId===USER.id) return toast(L.takeSelf);

  await dbUpd("tickets/"+id, {takenBy:USER.id, takenByName:USER.name, status:"open"});

  closeModal(); openTicket(id);

}

async function resolveTicket(id, res){

  const t = await dbGet("tickets/"+id);

  if(!t || t.takenBy!==USER.id || t.status!=="open") return;

  const uref = db.ref("users/"+t.userId+"/balance");

  if(t.type==="deposit"){

    if(res==="done"){

      await uref.transaction(v=>(v||0)+t.amount);

      await houseAdd("income", t.amount);

    }

  } else {

    if(res==="done"){

      await houseAdd("outcome", Math.floor(t.amount*(100-WITHDRAW_COMMISSION)/100));

    } else {

      await uref.transaction(v=>(v||0)+t.amount); // возврат резерва

    }

  }

  await dbUpd("tickets/"+id, {status:"closed", resolvedAt:Date.now(), result:res});

  await dbPush("tickets/"+id+"/msgs", {from:USER.id, name:"SYSTEM", text: res==="done"?(t.type==="deposit"?L.arrived:L.withdrawn):L.rejected, ts:Date.now()});

  closeModal(); toast(L.done); go("tickets");

}

      <input id="cCd" inputmode="numeric" placeholder="${L.caseCooldown}">

      <input id="cExp" inputmode="numeric" placeholder="${L.caseExpire}" style="margin:8px 0">

      <div class="muted" style="margin:10px 0 4px">${L.caseContents}</div>

      <div id="cPick">${Object.entries(ITEMS).map(([k,v])=>`

        <div class="row" style="margin-bottom:6px">

          <input type="checkbox" id="ck_${k}" style="width:20px">

          <span class="grow small">${esc(v.name)} · ${fmt(v.price)}</span>

          <input id="cc_${k}" inputmode="numeric" placeholder="%" style="width:70px;padding:6px">

        </div>`).join("")||`<span class="muted">${L.noData}</span>`}</div>

      <button class="btn" style="width:100%;margin-top:10px" onclick="addCase()">${L.add}</button>

    </div>

    <div class="grid">${Object.entries(CASES).map(([k,v])=>`

      <div class="item-card"><img src="${v.icon||defaultGoldIcon()}">

      <div class="item-name">${esc(v.name)}</div><div class="item-price">${fmt(v.price)} ${L.gold}</div>

      <button class="btn ghost" style="width:100%;padding:7px;font-size:12px" onclick="delCase('${k}')">${L.del}</button></div>`).join("")}</div>`;

}

async function addCase(){

  const name = $("#cName").value.trim(), price = parseInt($("#cPrice").value.replace(/\D/g,""));

  if(!name||!price) return toast(L.errFill);

  const contents = {};

  Object.keys(ITEMS).forEach(k=>{

    if($("#ck_"+k).checked){

      const w = parseInt($("#cc_"+k).value)||0;

      if(w>0) contents[k] = {chance:w};

    }

  });

  if(!Object.keys(contents).length) return toast(L.caseContents+": 0");

  const total = parseInt($("#cTotal").value)||0, userL = parseInt($("#cUser").value)||0;

  const cd = parseInt($("#cCd").value)||0, exp = parseInt($("#cExp").value)||0;

  await dbPush("cases", {

    name, price, icon:($("#cIcon")&&!$("#cIcon").classList.contains("hidden"))?$("#cIcon").src:"",

    contents, totalLimit:total, userLimit:userL, cooldown:cd,

    expiresAt: exp>0 ? Date.now()+exp*3600000 : 0

  });

  toast(L.done); aCases();

}

async function delCase(k){ await db.ref("cases/"+k).remove(); aCases(); }



async function aAnn(){

  ANN = (await dbGet("announcements"))||{};

  $("#adminBody").innerHTML = `

    <div class="card">

      <textarea id="aText" rows="3" placeholder="${L.annText}"></textarea>

      <div class="file-btn" onclick="pickImage(d=>{$('#aImg').src=d;$('#aImg').classList.remove('hidden')})">${L.annImage}</div>

      <img id="aImg" class="hidden" style="border-radius:10px;max-height:120px">

      <button class="btn" style="width:100%;margin-top:8px" onclick="addAnn()">${L.publish}</button>

    </div>

    ${Object.entries(ANN).sort((a,b)=>b[1].ts-a[1].ts).map(([k,v])=>`

      <div class="card ann"><div class="row"><div class="grow">${esc(v.text||"")}</div>

      <button class="btn ghost" style="padding:6px 10px;font-size:12px" onclick="delAnn('${k}')">${L.del}</button></div>

      ${v.image?`<img src="${v.image}">`:""}</div>`).join("")||`<p class="muted">${L.noData}</p>`}`;

}

async function addAnn(){

  const text = $("#aText").value.trim();

  const hasImg = $("#aImg") && !$("#aImg").classList.contains("hidden");

  if(!text && !hasImg) return toast(L.errFill);

  await dbPush("announcements", {text, image:hasImg?$("#aImg").src:"", ts:Date.now()});

  toast(L.done); aAnn();

}

async function delAnn(k){ await db.ref("announcements/"+k).remove(); aAnn(); }



async function aUsers(){

  const q = ($("#uq")?$("#uq").value.trim():"");

  let users = (await dbGet("users"))||{};

  let list = Object.entries(users);

  if(q) list = list.filter(([id])=>id.includes(q));

  list.sort((a,b)=>b[0].localeCompare(a[0]));

  $("#adminBody").innerHTML = `

    <input id="uq" placeholder="${L.searchById}" value="${esc(q)}" oninput="clearTimeout(window._ut);window._ut=setTimeout(aUsers,500)">

    <div style="margin-top:12px">${list.slice(0,30).map(([id,u])=>`

      <div class="card">

        <div class="row">

          <b class="grow">${esc(u.name||"")}</b>

          <span class="small">ID ${id}</span>

        </div>

        <div class="stat"><span>${L.userBalance}</span><b>${fmt(u.balance)} ${L.gold}</b></div>

        <div class="stat"><span>${L.role}</span><b>${u.role==="moderator"?L.roleModer:(ADMIN_IDS.map(String).includes(id)?"admin":L.rolePlayer)}</b></div>

        <div class="row" style="margin-top:8px;gap:8px">

          <button class="btn ghost grow" style="padding:8px" onclick="editUser('${id}',${u.balance||0},'${esc(u.name||"")}')">${L.edit}</button>

          <button class="btn grow" style="padding:8px" onclick="toggleRole('${id}','${u.role||"player"}')">${L.role}</button>

        </div>

      </div>`).join("")}</div>`;

}

function editUser(id, bal, name){

  openModal(`<h2>${L.adminUsers}</h2>

    <input id="eName" value="${esc(name)}" placeholder="${L.playerName}" style="margin:10px 0">

    <input id="eBal" inputmode="numeric" value="${bal}" placeholder="${L.userBalance}">

    <button class="btn" style="width:100%;margin-top:12px" onclick="saveUser('${id}')">${L.save}</button>`);

}

async function saveUser(id){

  const name = $("#eName").value.trim(), bal = parseInt($("#eBal").value.replace(/\D/g,""))||0;

  await dbUpd("users/"+id, {name, balance:bal});

  closeModal(); toast(L.saved); aUsers();

}

async function toggleRole(id, cur){

  const next = cur==="moderator" ? "player" : "moderator";

  await dbSet("users/"+id+"/role", next);

  toast(L.changeRole); aUsers();

}



async function aFin(){

  CONFIG = Object.assign({house:{income:0,outcome:0}}, (await dbGet("config"))||{});

  const h = CONFIG.house||{};

  const diff = (h.income||0)-(h.outcome||0);

  $("#adminBody").innerHTML = `

    <div class="card">

      <div class="stat"><span>${L.houseIncome}</span><b>${fmt(h.income||0)}</b></div>

      <div class="stat"><span>${L.houseOutcome}</span><b>${fmt(h.outcome||0)}</b></div>

      <div class="stat"><span>${L.houseDiff}</span><b style="color:${diff>=0?"#fff":"#888"}">${fmt(diff)}</b></div>

      <p class="small" style="margin-top:8px">${HOUSE_EDGE}% — ${L.app}. ${L.chance} = (100−${HOUSE_EDGE})% / ${L.multiplier.toLowerCase()}</p>

    </div>

    <div class="card">

      <div class="muted" style="margin-bottom:8px">${L.curIcon} / ${L.balIcon}</div>

      <div class="file-btn" onclick="pickImage(d=>setCurIcon(d))">${L.curIcon}</div>

    </div>`;

}

async function setCurIcon(d){

  await dbSet("config/currencyIcon", d);

  toast(L.saved); aFin();

}



/* ============ КАЗНА (helper) ============ */

async function houseAdd(field, v){

  await db.ref("config/house/"+field).transaction(cur=>(cur||0)+Math.round(v));

}



/* ============ START ============ */

(async function init(){

  try{ fbInit(); }catch(e){ $("#app").innerHTML = "<p style='padding:20px'>Ошибка Firebase: проверьте FIREBASE_CONFIG</p>"; return; }

  const tg = getTgUser();

  if(tg){ await ensureUser(tg); startApp(); }

  else {

    const saved = localStorage.getItem("zxu_id");

    if(saved){ await ensureUser({id:saved, name:localStorage.getItem("zxu_name")||("id"+saved)}); startApp(); }

    else renderLogin();

  }

})();



function startApp(){

  $("#header").style.visibility="visible";

  renderHeader(); buildMenu(); go("main");

}

</script>

</body>
