<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZombixUP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root { --bg:#0b0b0b; --card:#171717; --text:#f5f5f5; --muted:#8d8d8d; --line:#2c2c2c; --accent:#fff; --green:#4caf50; --red:#ef5350; }
  html, body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; height:100%; overflow:hidden; }
  /* Адаптивная ширина без масштабирования всей страницы: предотвращает выход интерфейса за край телефона. */
  html, body { width:100%; max-width:100%; min-width:0; }
  body { height:100%; overflow:hidden; }

  #auth-screen { position:fixed; inset:0; background:radial-gradient(circle at 50% 0%, #1e1e1e, #0b0b0b 70%); z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #auth-screen.show { display:flex; }
  #auth-screen h1 { font-size:30px; letter-spacing:3px; margin-bottom:4px; }
  #auth-screen .sub { color:var(--muted); font-size:13px; margin-bottom:26px; }
  #auth-screen .card { width:100%; max-width:340px; animation:rise .4s ease; }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

  #ambient-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:.72; }
  .app { height:100vh; display:flex; flex-direction:column; position:relative; z-index:1; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); background:#101010; z-index:10; }
  .logo { font-weight:800; letter-spacing:1.5px; font-size:16px; }
  .logo span { color:var(--muted); font-weight:400; font-size:11px; display:block; letter-spacing:0; margin-top:2px; }
  .balance { font-size:17px; font-weight:700; display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); padding:8px 12px; border-radius:20px; }
  .balance small { color:var(--muted); font-weight:400; }
