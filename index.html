<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZombixUp</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--bg2:#121212;--bg3:#181818;--line:#262626;--line2:#333;--tx:#f2f2f2;--dim:#8a8a8a;--ok:#7fdc7f;--bad:#ff6b6b}
html,body{background:var(--bg);color:var(--tx);font-family:'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
body{user-select:none}
input,textarea,select,button{font-family:inherit}
#app{max-width:540px;margin:0 auto;padding-bottom:40px}
/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:60;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
.bal{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.5px}
.bal img{width:26px;height:26px;border-radius:50%;object-fit:cover;box-shadow:0 0 10px rgba(255,255,255,.15)}
.bal .cur{color:var(--dim);font-size:12px;font-weight:600;text-transform:uppercase}
.burger{width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);color:#fff;font-size:20px;cursor:pointer;transition:.2s}
.burger:active{transform:scale(.93)}
/* ===== MENU (выпадает сверху) ===== */
.menu{position:fixed;top:66px;right:12px;width:232px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:8px;z-index:100;transform:translateY(-14px) scale(.97);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.9,.3,1.15),opacity .25s}
.menu.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.menu .mi{display:block;width:100%;text-align:left;background:none;border:none;color:var(--tx);padding:12px 14px;font-size:15px;font-weight:600;border-radius:10px;cursor:pointer;transition:.15s}
.menu .mi:active{background:#222}
.menu .mi.act{background:#1e1e1e;box-shadow:inset 2px 0 0 #fff}
.menu .mi.admin{color:#fff;border:1px dashed #444;margin-top:6px}
/* ===== SCREEN ===== */
#screen{padding:16px 14px}
h1{font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #fff;display:inline-block}
h2{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin:22px 0 10px;color:#ddd}
h4{margin:14px 0 8px;font-size:13px;text-transform:uppercase;color:#bbb;letter-spacing:1px}
.dim{color:var(--dim);font-size:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.center{text-align:center}
.row{display:flex;gap:8px}
.row>*{flex:1}
/* ===== BUTTONS ===== */
.btn{display:inline-block;border:none;border-radius:10px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;background:#fff;color:#000;transition:.15s;text-transform:uppercase;letter-spacing:.5px}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line2)}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.danger{background:var(--bad);color:#fff}
.btn.wfull{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
/* ===== FORMS ===== */
.form{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.form input[type=text],.form input[type=number],.form textarea,.input{width:100%;background:#0d0d0d;border:1px solid var(--line2);border-radius:10px;color:#fff;padding:12px;font-size:14px;margin-bottom:10px;outline:none;user-select:text}
.form input:focus,.input:focus{border-color:#666}
.form textarea{resize:vertical;min-height:70px}
label.flabel{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;margin-bottom:4px;letter-spacing:.5px}
.filebtn{display:block;text-align:center;border:1px dashed var(--line2);border-radius:10px;padding:12px;cursor:pointer;color:var(--dim);font-size:13px;margin-bottom:10px;transition:.15s}
.filebtn:active{background:#1c1c1c}
.filebtn input{display:none}
.preview{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line2);display:block;margin-bottom:10px;background:#000}
/* ===== CASES ===== */
.casegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.case{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;transition:.3s}
.case.exp{opacity:.45}
.cicon{position:relative;width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line2);margin-bottom:8px}
.cicon img{width:100%;height:100%;object-fit:cover}
.cname{position:absolute;top:0;left:0;right:0;padding:6px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent);text-shadow:0 1px 3px #000}
.ctimer{position:absolute;bottom:0;left:0;right:0;padding:6px;font-size:10px;font-weight:700;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);color:#ffcf5a}
.case .buy{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;color:#000;border:none;border-radius:10px;padding:11px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
.case .buy:active{transform:scale(.95)}
.case .buy img{width:15px;height:15px;border-radius:50%}
.case .left{font-size:11px;color:var(--dim);margin-top:6px;min-height:14px;text-transform:uppercase;letter-spacing:.5px}
/* ===== ANNOUNCEMENTS ===== */
.ann{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;animation:fadeIn .4s}
.ann img{width:100%;display:block;max-height:220px;object-fit:cover}
.ann .atext{padding:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
.ann .atime{padding:0 12px 10px;font-size:11px;color:var(--dim)}
/* ===== INVENTORY / ITEMS ===== */
.igrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.itile{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.itile .iimg{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:#000;border:1px solid var(--line2);margin-bottom:8px}
.itile .iph{width:100%;aspect-ratio:1;border-radius:10px;background:#151515;border:1px solid var(--line2);margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#444}
.itile .iname{font-size:13px;font-weight:700;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.itile .iprice{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:#ffcf5a;font-weight:700;margin-bottom:8px}
.itile .iprice img{width:13px;height:13px;border-radius:50%}
.itile .row{gap:6px}
/* ===== UPGRADE ===== */
.upgbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.rollbar{height:14px;background:#1c1c1c;border-radius:7px;overflow:hidden;margin:12px 0;position:relative}
.rollzone{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#fff,#999);border-radius:7px;transition:width .08s linear}
.rollnum{font-size:44px;font-weight:900;margin:6px 0}
input[type=range]{width:100%;accent-color:#fff}
.chance-big{font-size:30px;font-weight:900}
/* ===== TICKETS ===== */
.th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.sel{border-color:#fff !important}
/* ===== TICKETS2 ===== */
.chip{display:inline-block;border:1px solid var(--line2);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;margin:0 6px 8px 0;transition:.15s}
.chip.act{background:#fff;color:#000;border-color:#fff}
.tk{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.tk .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:4px 8px;border-radius:6px;letter-spacing:.5px}
.badge.open{background:#fff;color:#000}
.badge.closed{background:#222;color:#777;border:1px solid #333}
.badge.dep{color:#7fdc7f}.badge.wd{color:#ff8f8f}
.tk .tinfo{font-size:13px;color:#ccc}
/* ===== CHAT ===== */
.cmsgs{height:260px;overflow-y:auto;background:#0d0d0d;border:1px solid var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{max-width:80%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4;word-break:break-word;user-select:text}
.msg.me{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:3px}
.msg.them{align-self:flex-start;background:#1e1e1e;border-bottom-left-radius:3px}
.msg .mt{font-size:9px;opacity:.55;margin-top:3px}
.cinput{display:flex;gap:8px}
.cinput input{flex:1;background:#0d0d0d;border:1px solid var(--line2);border-radius:10px;color:#fff;padding:11px;font-size:14px;outline:none}
/* ===== MODAL ===== */
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
#modalWrap.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:86vh;overflow-y:auto;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mclose{float:right;background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:0 4px}
/* ===== TOASTS ===== */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:90vw}
.toast{background:#fff;color:#000;font-weight:700;font-size:13px;padding:11px 18px;border-radius:24px;animation:tin .3s;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
/* ===== MISC ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs button{flex-shrink:0;background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:9px 13px;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase}
.tabs button.act{background:#fff;color:#000;border-color:#fff}
.pill{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--dim)}
.pill.admin{color:#fff;border-color:#fff}.pill.mod{color:#9fd0ff;border-color:#9fd0ff}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat b{font-weight:800}
.avatar{width:54px;height:54px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;margin:0 auto 10px}
.gold-big{font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0}
.gold-big img{width:28px;height:28px;border-radius:50%}
.irow{display:flex;align-items:center;gap:10px;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.irow img{width:38px;height:38px;border-radius:8px;object-fit:cover}
.irow .n{flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .w{color:#ffcf5a;font-size:12px;white-space:nowrap}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="bal"><img id="curIcon" alt=""><span id="balVal">0</span><span class="cur" id="curName"></span></div>

  </div>
  <nav id="menu" class="menu"></nav>
  <main id="screen"></main>
</div>
<div id="modalWrap"><div class="modal" id="modalBox"></div></div>
<div id="toasts"></div>
<script>

/* ==================== ВСЕ ПОДПИСИ — КОНСТАНТЫ ==================== */
const L = {
  APP:'ZombixUp', GOLD:'Золото',
  MENU_T:'Меню', HOME:'Главная', INVENTORY:'Инвентарь', UPGRADE:'Апгрейдер',

  DEP_DONE:'Пополнение выполнено', WD_DONE:'Вывод выполнен', TK_REJECT:'Тикет отклонён',

  TAKEN_BY:'Взял модератор', NOT_YOURS:'Этот тикет взят другим модератором', NO_PERM:'Недостаточно прав',

  ADD_ITEM:'Добавить предмет', ITEM_NAME:'Название', ITEM_PRICE:'Цена', ITEM_ICON:'Иконка / фото',
  SAVE:'Сохранить', DELETE:'Удалить', EDIT:'Изменить', SAVED:'Сохранено',
  ADD_CASE:'Создать кейс', CASE_NAME:'Название кейса', CASE_ICON:'Иконка кейса',
  CASE_PRICE:'Цена открытия', CASE_LIMIT:'Лимит открытий на всех (0 = без лимита)',
  CASE_ULIMIT:'Открытий на игрока (0 = без лимита)', CASE_CD:'КД открытия, сек (0 = нет)',
  CASE_EXPIRES:'Исчезнет через, часов (0 = никогда)', CASE_ITEMS:'Наполнение кейса и шансы (вес)',
  SEARCH_USER:'Поиск по Telegram ID', FIND:'Найти', ROLE:'Роль', ROLE_PLAYER:'Игрок',
  ROLE_MOD:'Модератор', USER_NOT_FOUND:'Игрок не найден', APPLY:'Применить',
  CURRENCY_ICON:'Иконка валюты / баланса', CUR_SET:'Иконка обновлена',
  INCOME:'Доход игры (проигрыши и кейсы)', EXPENSE:'Расход игры (выигрыши и продажи)',
  PROFIT:'Прибыль проекта', EDGE:'Заложено преимущество проекта: 5%',

  ENTER:'Вход', INPUT_NAME:'Ваше имя', INPUT_ID:'Ваш Telegram ID', GO:'Войти',
  LOADIMG:'Обработка фото...', CASE_EMPTY:'Кейс пуст',
  ADD_ITEMS_FIRST:'Сначала добавьте предметы в кейс', ENTER_TEXT:'Введите текст', CHAT_EMPTY:'Нет сообщений',
  ENTER_ID:'Введите ID', ALL:'Все'
};

/* ==================== УТИЛИТЫ ==================== */
const $ = s => document.querySelector(s);
const DB = () => firebase.database();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => Math.floor(Number(n)||0).toLocaleString('ru-RU');
const DEFAULT_CUR = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#e8c34a"/><circle cx="32" cy="32" r="23" fill="#f6d565"/><text x="32" y="41" font-size="24" text-anchor="middle" fill="#7a5b00" font-family="Arial" font-weight="bold">G</text></svg>');

function toast(text, ok=true){
  const d=document.createElement('div');
  d.className='toast'+(ok?'':' bad'); d.textContent=text;
  $('#toasts').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transition='.3s';setTimeout(()=>d.remove(),320)},2400);
}
function modal(html){ $('#modalBox').innerHTML=html; $('#modalWrap').classList.add('show'); }
function modalClose(){
  $('#modalWrap').classList.remove('show');
  if(S.chatRef){ S.chatRef.off(); S.chatRef=null; }
  if(S.chatRef2){ S.chatRef2.off(); S.chatRef2=null; }
  S.chatTid=null;
}
function hms(ms){
  if(ms<0) return '00:00:00';
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}
function dt(ts){ return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function fileToDataUrl(file, cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const k=Math.min(1, 256/Math.max(img.width,img.height));
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function pickImg(ev, kind){
  const f=ev.target.files[0]; if(!f) return;
  toast(L.LOADIMG,true);
  fileToDataUrl(f, d=>{ S.pend[kind]=d; const p=$('#prev_'+kind); if(p) p.src=d; });
}
window.pickImg=pickImg;

/* ==================== STATE ==================== */
const S = {
  user:null, gold:0, role:'player', profile:{},
  screen:'home', adminTab:'items', tfType:'all', tfStatus:'all',
  items:{}, cases:{}, ann:{}, inv:{}, myCases:{}, tickets:{}, cfg:{},

  pend:{}, editItem:null, editCase:null, foundUser:null, searchId:'',
  menuOpen:false, chatRef:null, chatTid:null
};
const isAdmin = () => ADMIN_IDS.includes(Number(S.user&&S.user.id));
const canModerate = () => isAdmin() || S.role==='moderator';

/* ==================== ВХОД ==================== */
function boot(){
  const tg=window.Telegram&&Telegram.WebApp;
  if(tg){ tg.ready(); tg.expand(); }
  $('#curName').textContent=L.GOLD;
  $('#burger').addEventListener('click',e=>{ e.stopPropagation(); toggleMenu(); });
  document.addEventListener('click', e=>{
    if(S.menuOpen && !e.target.closest('#menu') && !e.target.closest('#burger')) toggleMenu(false);
    const el=e.target.closest('[data-act]');
    if(el && ACTIONS[el.dataset.act]) { e.preventDefault(); ACTIONS[el.dataset.act](el); }
  });
  $('#modalWrap').addEventListener('click', e=>{ if(e.target.id==='modalWrap') modalClose(); });
  setInterval(timersTick,1000);
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(u&&u.id) login(u.id, [u.first_name,u.last_name].filter(Boolean).join(' '));
  else devLogin();
}
function devLogin(){
  modal(`<h3 style="margin-bottom:12px">${L.ENTER}</h3>
    <input class="input" id="devId" type="number" placeholder="${L.INPUT_ID}">
    <input class="input" id="devName" type="text" placeholder="${L.INPUT_NAME}">
    <button class="btn wfull" data-act="devGo">${L.GO}</button>`);
}
function login(id, name){
  S.user={id:Number(id), name:name||('ID '+id)};
  db.ref('users/'+S.user.id).once('value').then(s=>{
    if(!s.exists()){
      db.ref('users/'+S.user.id).set({name:S.user.name, gold:0, role:'player', createdAt:Date.now()});
    }
    startListeners();
  });
}
function devGo(){
  const id=Number($('#devId').value), n=$('#devName').value.trim();
  if(!id){ toast(L.ENTER_ID, false); return; }
  modalClose(); login(id, n);
}

/* ==================== СЛУШАТЕЛИ FIREBASE ==================== */
function softRender(){
  const a=document.activeElement;
  if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')&&$('#screen').contains(a)) return;
  render();
}
function startListeners(){
  db.ref('users/'+S.user.id).on('value', s=>{
    const v=s.val()||{};
    S.profile=v; S.gold=v.gold||0;
    S.role = isAdmin()?'admin':(v.role||'player');
    updateTop();
    if(S.screen==='profile') render();
  });
  db.ref('items').on('value', s=>{ S.items=s.val()||{}; softRender(); });
  db.ref('cases').on('value', s=>{ S.cases=s.val()||{}; softRender(); });
  db.ref('announcements').on('value', s=>{ S.ann=s.val()||{}; softRender(); });
  db.ref('config').on('value', s=>{ S.cfg=s.val()||{}; updateTop(); softRender(); });
  db.ref('inventory/'+S.user.id).on('value', s=>{ S.inv=s.val()||{}; softRender(); });
  db.ref('userCases/'+S.user.id).on('value', s=>{ S.myCases=s.val()||{}; softRender(); });
  db.ref('tickets').on('value', s=>{ S.tickets=s.val()||{}; softRender(); });
  updateTop(); render();
}
function updateTop(){
  $('#balVal').textContent=fmt(S.gold);
  $('#curIcon').src=(S.cfg&&S.cfg.currencyIcon)||DEFAULT_CUR;
}

/* ==================== МЕНЮ ==================== */
function toggleMenu(v){
  S.menuOpen = v===undefined ? !S.menuOpen : v;
  $('#menu').classList.toggle('open', S.menuOpen);
}
function renderMenu(){
  const arr=[['home',L.HOME],['inventory',L.INVENTORY],['upgrade',L.UPGRADE],['profile',L.PROFILE],['settings',L.SETTINGS]];
  if(canModerate()) arr.push(['tickets',L.TICKETS]);
  if(isAdmin()) arr.push(['admin',L.ADMIN]);
  $('#menu').innerHTML=arr.map(([k,t])=>
    `<button class="mi${S.screen===k?' act':''}${k==='admin'?' admin':''}" data-act="nav" data-s="${k}">${t}</button>`).join('');

/* ==================== РОУТЕР ==================== */
const SCREENS={home:scHome, inventory:scInventory, upgrade:scUpgrade, profile:scProfile, settings:scSettings, tickets:scTickets, admin:scAdmin};
function render(){
  renderMenu();

/* ==================== ЭКРАН: ГЛАВНАЯ ==================== */
function annCard(id,a){
  return `<div class="ann">
    ${a.image?`<img src="${a.image}" alt="">`:''}
    <div class="atext">${esc(a.text)}</div>
    <div class="atime">${dt(a.ts)}</div>
  </div>`;
}
function curIco(){ return `<img src="${esc((S.cfg&&S.cfg.currencyIcon)||DEFAULT_CUR)}" alt="">`; }
function caseCard(id,c){
  const expired=c.expiresAt&&Date.now()>c.expiresAt;
  const left=c.limit?Math.max(0,c.limit-(c.opened||0)):null;
  const closed=expired||(left!==null&&left<=0);
  return `<div class="case${closed?' exp':''}">
    <div class="cicon">
      ${c.icon?`<img src="${esc(c.icon)}" alt="">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px">?</div>`}
      <div class="cname">${esc(c.name)}</div>
      <div class="ctimer">${c.expiresAt?`<span data-exp="${c.expiresAt}"></span>`:''}</div>
    </div>
    <button class="buy" data-act="opencase" data-id="${id}" ${closed?'disabled':''}>${curIco()}${fmt(c.price||0)}</button>
    <div class="left">${left!==null?L.LEFT+': '+left:''}</div>
  </div>`;
}
function scHome(){
  const ann=Object.entries(S.ann).sort((a,b)=>b[1].ts-a[1].ts);
  const cs=Object.entries(S.cases);
  return `<h1>${L.HOME}</h1>
  <h2>${L.ANN_T}</h2>
  ${ann.length?ann.map(([id,a])=>annCard(id,a)).join(''):`<p class="dim">${L.ANN_EMPTY}</p>`}
  <h2>${L.CASES_T}</h2>
  ${cs.length?`<div class="casegrid">${cs.map(([id,c])=>caseCard(id,c)).join('')}</div>`:`<p class="dim">${L.CASES_EMPTY}</p>`}`;
}
function timersTick(){
  document.querySelectorAll('[data-exp]').forEach(el=>{
    const t=+el.dataset.exp-Date.now();
    el.textContent=t>0?hms(t):L.CASE_CLOSED;
  });
}

/* ==================== ЭКРАН: ИНВЕНТАРЬ ==================== */
function itemTile(id,it){

}
function scInventory(){

function addGold(v){ db.ref('users/'+S.user.id+'/gold').transaction(g=>(g||0)+v); }
function house(k,v){ db.ref('config/house/'+k).transaction(x=>(x||0)+v); }
function sellItem(id){
  const it=S.inv[id]; if(!it) return;
  if(!confirm(L.SELL_Q+' '+esc(it.name)+'?')) return;
  db.ref('inventory/'+S.user.id+'/'+id).remove();

  if(S.upgSel===id) S.upgSel=null;

/* ==================== ЭКРАН: АПГРЕЙДЕР ==================== */
function chanceFor(m){ return Math.min(90, 95/m); }
function scUpgrade(){
  const arr=Object.entries(S.inv);
  if(!arr.length) return `<h1>${L.UPG_TITLE}</h1><p class="dim">${L.INV_EMPTY}</p>`;
  const sel=S.upgSel&&S.inv[S.upgSel]?S.inv[S.upgSel]:null;
  const m=S.upgMult||2, ch=sel?chanceFor(m):0, pay=sel?Math.floor(sel.price*m):0;
  return `<h1>${L.UPG_TITLE}</h1>
  <h4>${L.UPG_PICK}</h4>
  <div class="igrid">${arr.map(([id,it])=>`
    <div class="itile${S.upgSel===id?' sel':''}" data-act="upgSelItem" data-id="${id}" style="${S.upgSel===id?'border-color:#fff;cursor:pointer':''}">
      ${it.icon?`<img class="iimg" src="${esc(it.icon)}" alt="">`:`<div class="iph">${esc((it.name||'?')[0])}</div>`}
      <div class="iname">${esc(it.name)}</div>
      <div class="iprice">${curIco()}${fmt(it.price)}</div>
    </div>`).join('')}</div>
  ${sel?`<div class="upgbox" style="margin-top:14px">
    <div class="iname" style="font-size:15px">${esc(sel.name)}</div>
    <div class="iprice" style="justify-content:center">${curIco()}${fmt(sel.price)}</div>
    <label class="flabel">${L.UPG_MULT}: x${m}</label>
    <input type="range" min="2" max="50" step="1" value="${m}" id="upgRange">
    <div class="row" style="margin-top:12px">
      <div><div class="dim" style="font-size:11px">${L.UPG_CHANCE}</div><div class="chance-big">${ch.toFixed(1)}%</div></div>
      <div><div class="dim" style="font-size:11px">${L.UPG_WIN}</div><div class="chance-big">${curIco()}<span style="font-size:22px">${fmt(pay)}</span></div></div>
    </div>
    <div class="rollbar"><div class="rollzone" id="rollZone" style="width:0%"></div></div>
    <div class="rollnum" id="rollNum">${S.rolling?L.UPG_ROLLING:'0'}</div>
    <button class="btn wfull" data-act="upgGo" ${S.rolling?'disabled':''}>${S.rolling?'<span class=spin></span> '+L.UPG_ROLLING:L.UPG_GO}</button>
  </div>`:''}`;
}
function bindRange(){
  const r=$('#upgRange');
  if(r) r.addEventListener('input',()=>{
    S.upgMult=+r.value;
    const sel=S.inv[S.upgSel];
    const ch=chanceFor(S.upgMult), pay=sel?Math.floor(sel.price*S.upgMult):0;
    const box=r.closest('.upgbox');
    box.querySelector('.chance-big').textContent=ch.toFixed(1)+'%';
    box.querySelectorAll('.chance-big')[1].querySelector('span').textContent=fmt(pay);
    box.querySelector('.flabel').textContent=L.UPG_MULT+': x'+S.upgMult;
  });
}
function doUpgrade(){
  if(S.rolling) return;
  const entry=S.inv[S.upgSel]; if(!entry) return;
  const m=S.upgMult, ch=chanceFor(m);
  S.rolling=true; render();
  const zone=$('#rollZone'), num=$('#rollNum');
  let t0=Date.now();
  const iv=setInterval(()=>{
    const p=(Date.now()-t0)/1600;
    if(p>=1){ clearInterval(iv); finish(Math.random()*100); }
    else { const fake=Math.random()*100; num.textContent=Math.floor(fake); zone.style.width=fake+'%'; }
  },70);
  function finish(r){
    num.textContent=r.toFixed(1); zone.style.width=r+'%';
    setTimeout(()=>{
      if(r<ch){ const pay=Math.floor(entry.price*m); addGold(pay); house('expense',pay); toast(L.UPG_OK+' +'+fmt(pay),true); }
      else { db.ref('inventory/'+S.user.id+'/'+S.upgSel).remove(); house('income',entry.price); toast(L.UPG_FAIL,false); S.upgSel=null; }
      S.rolling=false; render();
    },700);
  }
}

function ticketForm(type){
  modal(`<h3 style="margin-bottom:12px">${type==='deposit'?L.DEP:L.WD}</h3>
    <label class="flabel">${L.AMOUNT} (${L.GOLD})</label>
    <input class="input" id="tkAmount" type="number" min="1">

}
function createTicket(type){
  const amount=Math.floor(Number($('#tkAmount').value)||0);
  if(amount<=0){ toast(L.BAD_AMOUNT,false); return; }
  if(type==='withdraw'&&amount>S.gold){ toast(L.NOT_ENOUGH,false); return; }
  if(type==='withdraw') addGold(-amount);
  db.ref('tickets').push({
    uid:S.user.id, uname:S.profile.name||('ID '+S.user.id),
    type, amount, status:'open', assignedTo:null, createdAt:Date.now()
  });
  modalClose();
  if(type==='withdraw') toast(L.WD_RESERVE,true); else toast(L.CREATE,true);
}

/* ==================== ЧАТ ТИКЕТА ==================== */
function openTicketChat(tid){
  const t=S.tickets[tid]; if(!t) return;
  S.chatTid=tid;
  modal(`<button class="mclose" data-act="closeModal">&#10005;</button>
    <h3 style="margin-bottom:4px">${L.CHAT_WITH}</h3>
    <div class="th" style="margin-bottom:6px">
      <span class="badge ${t.type==='deposit'?'dep':'wd'}">${t.type==='deposit'?L.DEPOSIT:L.WITHDRAW}</span>
      <span class="badge ${t.status==='open'?'open':'closed'}" id="tkStatus">${t.status==='open'?L.OPEN:L.CLOSED}</span>
      <span style="font-size:14px;font-weight:800">${curIco()} ${fmt(t.amount)}</span>
    </div>
    <div class="tinfo dim" style="font-size:11px;margin-bottom:4px">${esc(t.uname||'')} · ${dt(t.createdAt)}</div>
    <div class="cmsgs" id="chatMsgs"></div>
    <div class="cinput">
      <input id="chatText" placeholder="${L.MSG_PLACE}">
      <button class="btn" data-act="sendMsg">&#10148;</button>
    </div>
    <div class="row" style="margin-top:10px" id="tkBtns"></div>`);
  renderChatMsgs(); renderChatBtns();
  if(S.chatRef) S.chatRef.off();
  S.chatRef=db.ref('tickets/'+tid+'/messages');
  S.chatRef.on('value', s=>{ renderChatMsgs(); });
  S.chatRef2=db.ref('tickets/'+tid);
  S.chatRef2.on('value', s=>{ const v=s.val(); if(v){ renderChatBtns(); const st=$('#tkStatus'); if(st) st.textContent=v.status==='open'?L.OPEN:L.CLOSED; } });
}
function renderChatMsgs(){
  const box=$('#chatMsgs'); if(!box||!S.chatTid) return;
  const t=S.tickets[S.chatTid]; if(!t) return;
  const msgs=Object.entries(t.messages||{}).sort((a,b)=>a[1].ts-b[1].ts);
  box.innerHTML=msgs.length?msgs.map(([id,m])=>{
    const me=m.uid===S.user.id;
    return `<div class="msg ${me?'me':'them'}">${esc(m.text)}<div class="mt">${esc(m.name||'')} · ${dt(m.ts)}</div></div>`;
  }).join(''):`<p class="dim" style="text-align:center;margin:auto">${L.CHAT_EMPTY}</p>`;
  box.scrollTop=box.scrollHeight;
}
function renderChatBtns(){
  const box=$('#tkBtns'); if(!box||!S.chatTid) return;
  const t=S.tickets[S.chatTid]; if(!t) return;
  const isOwner=t.uid===S.user.id;
  const isMod=canModerate();
  const isAssignee=t.assignedTo===S.user.id;
  let h='';
  if(isMod&&t.status==='open'){
    if(!t.assignedTo) h+=`<button class="btn sm wfull" data-act="takeTicket">${L.TAKE}</button>`;
    else if(isAssignee){
      h+=`<button class="btn sm" data-act="execTicket">${t.type==='deposit'?L.DEP_DONE:L.WD_DONE}</button>`;
      h+=`<button class="btn sm danger" data-act="rejectTicket">${L.REJECT}</button>`;
    }
  }
  if(!h&&isMod&&t.status!=='open') h=`<span class="badge closed">${L.CLOSED}</span>`;
  box.innerHTML=h;
}
function sendMsg(){
  const inp=$('#chatText'), text=(inp.value||'').trim();
  if(!text) return;
  inp.value='';
  db.ref('tickets/'+S.chatTid+'/messages').push({uid:S.user.id, name:S.profile.name||'', text, ts:Date.now()});
}
function takeTicket(){
  db.ref('tickets/'+S.chatTid+'/assignedTo').transaction(v=>v===null?S.user.id:v);
}
function execTicket(){
  const t=S.tickets[S.chatTid]; if(!t) return;
  if(t.assignedTo!==S.user.id){ toast(L.NOT_YOURS,false); return; }
  if(t.type==='deposit'){ db.ref('users/'+t.uid+'/gold').transaction(g=>(g||0)+t.amount); house('expense',t.amount); }
  db.ref('tickets/'+S.chatTid+'/status').set('closed');
  toast(t.type==='deposit'?L.DEP_DONE:L.WD_DONE,true);
  modalClose();
}
function rejectTicket(){
  const t=S.tickets[S.chatTid]; if(!t) return;
  if(t.assignedTo!==S.user.id){ toast(L.NOT_YOURS,false); return; }
  if(t.type==='withdraw'){ db.ref('users/'+t.uid+'/gold').transaction(g=>(g||0)+t.amount); }
  db.ref('tickets/'+S.chatTid+'/status').set('closed');
  toast(L.TK_REJECT,true);
  modalClose();
}

/* ==================== ЭКРАН: АДМИН ==================== */
function scAdmin(){
  if(!isAdmin()) return `<h1>${L.ADMIN}</h1><p class="dim">${L.NO_PERM}</p>`;
  const tabs=[['items',L.ADMIN_ITEMS],['cases',L.ADMIN_CASES],['ann',L.ADMIN_ANN],['users',L.ADMIN_USERS],['econ',L.ADMIN_ECON],['cfg',L.ADMIN_CFG]];
  const bodies={items:adItems, cases:adCases, ann:adAnn, users:adUsers, econ:adEcon, cfg:adCfg};
  return `<h1>${L.ADMIN}</h1>
  <div class="tabs">${tabs.map(([k,t])=>`<button class="${S.adminTab===k?'act':''}" data-act="setTab" data-t="${k}">${t}</button>`).join('')}</div>
  ${bodies[S.adminTab]()}`;
}

    <label class="flabel">${L.ITEM_PRICE} (${L.GOLD})</label>

    <label class="flabel">${L.ITEM_ICON}</label>
    <label class="filebtn">${L.ITEM_ICON}<input type="file" accept="image/*" onchange="pickImg(event,'item')"></label>
    <img class="preview" id="prev_item" src="${e&&e.icon?esc(e.icon):(S.pend.item||'')}" style="${(e&&e.icon)||S.pend.item?'':'display:none'}">
    <button class="btn wfull" data-act="saveItem">${e?L.SAVE:L.ADD_ITEM}</button>
    ${e?`<button class="btn ghost wfull" style="margin-top:8px" data-act="cancelEditItem">${L.REJECT}</button>`:''}
  </div>
  <h4>${L.ADMIN_ITEMS}</h4>
  ${arr.length?arr.map(([id,it])=>`<div class="irow">
    ${it.icon?`<img src="${esc(it.icon)}">`:`<img src="${DEFAULT_CUR}">`}
    <span class="n">${esc(it.name)}</span><span class="w">${curIco()}${fmt(it.price)}</span>
    <button class="btn sm ghost" data-act="editItem" data-id="${id}">${L.EDIT}</button>

function saveItem(){
  const name=($('#iName').value||'').trim(), price=Math.floor(Number($('#iPrice').value)||0);
  if(!name||price<=0){ toast(L.BAD_AMOUNT,false); return; }
  const data={name, price, icon:(S.pend.item||null)};
  if(S.editItem) db.ref('items/'+S.editItem).update(data);
  else db.ref('items').push(data);
  S.pend.item=null; S.editItem=null;
  toast(L.SAVED,true); render();
}

/* ---- админ: кейсы ---- */
function adCases(){
  const arr=Object.entries(S.cases);
  const e=S.editCase&&S.cases[S.editCase];
  const selItems=e?Object.entries(e.items||{}):[];
  return `<div class="form">
    <label class="flabel">${L.CASE_NAME}</label>
    <input id="cName" type="text" value="${e?esc(e.name):''}">
    <label class="flabel">${L.CASE_PRICE}</label>
    <input id="cPrice" type="number" min="0" value="${e?e.price||0:0}">
    <label class="flabel">${L.CASE_ICON}</label>
    <label class="filebtn">${L.CASE_ICON}<input type="file" accept="image/*" onchange="pickImg(event,'case')"></label>
    <img class="preview" id="prev_case" src="${e&&e.icon?esc(e.icon):(S.pend.case||'')}" style="${(e&&e.icon)||S.pend.case?'':'display:none'}">
    <label class="flabel">${L.CASE_LIMIT}</label>
    <input id="cLimit" type="number" min="0" value="${e?e.limit||0:0}">
    <label class="flabel">${L.CASE_ULIMIT}</label>
    <input id="cULimit" type="number" min="0" value="${e?e.userLimit||0:0}">
    <label class="flabel">${L.CASE_CD}</label>
    <input id="cCd" type="number" min="0" value="${e?e.cooldown||0:0}">
    <label class="flabel">${L.CASE_EXPIRES}</label>
    <input id="cExp" type="number" min="0" value="${e?e.expiresH||0:0}">
    <h4>${L.CASE_ITEMS}</h4>
    ${Object.entries(S.items).length?Object.entries(S.items).map(([id,it])=>`
      <div class="irow">
        <input type="checkbox" class="ciCheck" data-id="${id}" ${selItems.some(([k])=>k===id)?'checked':''}>
        ${it.icon?`<img src="${esc(it.icon)}">`:`<img src="${DEFAULT_CUR}">`}
        <span class="n">${esc(it.name)}</span>
        <input class="ciW" data-id="${id}" type="number" min="1" value="${(selItems.find(([k])=>k===id)||[,'1'])[1]}" style="width:56px;background:#0d0d0d;border:1px solid #333;border-radius:8px;color:#fff;padding:6px;text-align:center">
        <span class="w">${fmt(it.price)}</span>
      </div>`).join(''):`<p class="dim">${L.ADD_ITEMS_FIRST}</p>`}
    <button class="btn wfull" data-act="saveCase" style="margin-top:10px">${e?L.SAVE:L.ADD_CASE}</button>
    ${e?`<button class="btn ghost wfull" style="margin-top:8px" data-act="cancelEditCase">${L.REJECT}</button>`:''}
  </div>
  <h4>${L.ADMIN_CASES}</h4>
  ${arr.length?arr.map(([id,c])=>`<div class="irow">
    ${c.icon?`<img src="${esc(c.icon)}">`:`<img src="${DEFAULT_CUR}">`}
    <span class="n">${esc(c.name)}</span>
    <span class="w">${curIco()}${fmt(c.price||0)}</span>
    <button class="btn sm ghost" data-act="editCase" data-id="${id}">${L.EDIT}</button>
    <button class="btn sm danger" data-act="delCase" data-id="${id}">${L.DELETE}</button>
  </div>`).join(''):`<p class="dim">—</p>`}`;
}
function saveCase(){
  const name=($('#cName').value||'').trim(), price=Math.floor(Number($('#cPrice').value)||0);
  if(!name||price<0){ toast(L.BAD_AMOUNT,false); return; }
  const items={};
  document.querySelectorAll('.ciCheck').forEach(cb=>{
    if(cb.checked){ const w=Math.max(1,Math.floor(Number(document.querySelector('.ciW[data-id="'+cb.dataset.id+'"]').value)||1)); items[cb.dataset.id]=w; }
  });
  if(!Object.keys(items).length){ toast('Добавьте предметы в кейс',false); return; }
  const expH=Number($('#cExp').value)||0;
  const data={
    name, price, items, icon:(S.pend.case||null),
    limit:Math.floor(Number($('#cLimit').value)||0),
    userLimit:Math.floor(Number($('#cULimit').value)||0),
    cooldown:Math.floor(Number($('#cCd').value)||0),
    expiresH:expH
  };
  if(S.editCase){ db.ref('cases/'+S.editCase).update(data); }
  else{ data.createdAt=Date.now(); data.opened=0; if(expH>0) data.expiresAt=Date.now()+expH*3600000; db.ref('cases').push(data); }
  S.pend.case=null; S.editCase=null;
  toast(L.SAVED,true); render();
}
function rollCase(c){
  const entries=Object.entries(c.items||{}).filter(([id])=>S.items[id]);
  if(!entries.length) return null;
  const total=entries.reduce((s,[,w])=>s+w,0);
  let r=Math.random()*total;
  for(const [id,w] of entries){ r-=w; if(r<=0){ const it=S.items[id]; return {itemId:id, name:it.name, icon:it.icon||null, price:it.price, ts:Date.now()}; } }
  const [id]=entries[0]; const it=S.items[id];
  return {itemId:id, name:it.name, icon:it.icon||null, price:it.price, ts:Date.now()};
}
function openCase(id){
  const c=S.cases[id]; if(!c) return;
  if(c.expiresAt&&Date.now()>c.expiresAt){ toast(L.CASE_CLOSED,false); return; }
  const left=c.limit?c.limit-(c.opened||0):null;
  if(left!==null&&left<=0){ toast(L.NO_LEFT,false); return; }
  const uc=S.myCases[id]||{};
  if(c.userLimit&&uc.count>=c.userLimit){ toast(L.LIMIT_USER,false); return; }
  if(c.cooldown&&uc.lastTs&&Date.now()-uc.lastTs<c.cooldown*1000){
    toast(L.WAIT_CD.replace('{s}',Math.ceil((c.cooldown*1000-(Date.now()-uc.lastTs))/1000)),false); return;
  }
  if(S.gold<(c.price||0)){ toast(L.NOT_ENOUGH,false); return; }
  const item=rollCase(c); if(!item){ toast(L.CASE_EMPTY,false); return; }
  addGold(-(c.price||0)); house('income',c.price||0);
  db.ref('cases/'+id+'/opened').transaction(v=>(v||0)+1);
  db.ref('userCases/'+S.user.id+'/'+id).transaction(v=>({count:((v&&v.count)||0)+1,lastTs:Date.now()}));
  db.ref('inventory/'+S.user.id).push(item);
  modal(`<div style="text-align:center">
    <h3 style="margin-bottom:10px">${L.CASE_OPENED}</h3>
    ${item.icon?`<img src="${esc(item.icon)}" style="width:120px;height:120px;border-radius:14px;object-fit:cover;margin-bottom:10px">`:''}
    <div style="font-weight:800;font-size:17px">${esc(item.name)}</div>
    <div class="iprice" style="justify-content:center;margin-top:6px">${curIco()}${fmt(item.price)}</div>
    <button class="btn wfull" style="margin-top:14px" data-act="closeModal">OK</button>
  </div>`);
}

/* ---- админ: объявления ---- */
function adAnn(){
  const arr=Object.entries(S.ann).sort((a,b)=>b[1].ts-a[1].ts);
  return `<div class="form">
    <label class="flabel">${L.ANN_TEXT}</label>
    <textarea id="aText"></textarea>
    <label class="flabel">${L.ANN_IMG}</label>
    <label class="filebtn">${L.ANN_IMG}<input type="file" accept="image/*" onchange="pickImg(event,'ann')"></label>
    <img class="preview" id="prev_ann" src="${S.pend.ann||''}" style="${S.pend.ann?'':'display:none'}">
    <button class="btn wfull" data-act="saveAnn">${L.PUBLISH}</button>
  </div>
  <h4>${L.ANN_T}</h4>
  ${arr.length?arr.map(([id,a])=>`<div class="ann">
    ${a.image?`<img src="${esc(a.image)}">`:''}
    <div class="atext">${esc(a.text)}</div>
    <div class="atime">${dt(a.ts)}</div>
    <div style="padding:0 12px 12px"><button class="btn sm danger" data-act="delAnn" data-id="${id}">${L.DELETE}</button></div>
  </div>`).join(''):`<p class="dim">—</p>`}`;
}
function saveAnn(){
  const text=($('#aText').value||'').trim();
  if(!text){ toast(L.ENTER_TEXT,false); return; }
  db.ref('announcements').push({text, image:S.pend.ann||null, ts:Date.now()});
  S.pend.ann=null; $('#aText').value='';
  toast(L.SAVED,true); render();
}

/* ---- админ: игроки ---- */
function adUsers(){
  const u=S.foundUser;
  return `<div class="form">
    <label class="flabel">${L.SEARCH_USER}</label>
    <div class="row">
      <input id="uSearch" type="number" placeholder="ID" value="${S.searchId}">
      <button class="btn sm" data-act="findUser" style="flex:0 0 auto">${L.FIND}</button>
    </div>
  </div>
  ${u?`<div class="form">
    <div class="stat"><span>${L.NAME}</span><b>${esc(u.name||'')}</b></div>
    <div class="stat"><span>${L.TG_ID}</span><b>${u.tgId}</b></div>
    <div class="stat"><span>${L.ROLE}</span><b>${esc(u.role||L.ROLE_PLAYER)}</b></div>
    <label class="flabel" style="margin-top:10px">${L.NAME}</label>
    <input id="uName" type="text" value="${esc(u.name||'')}">
    <label class="flabel">${L.BALANCE} (${L.GOLD})</label>
    <input id="uGold" type="number" value="${u.gold||0}">
    <label class="flabel">${L.ROLE}</label>
    <select id="uRole" class="input">
      <option value="player" ${u.role!=='moderator'?'selected':''}>${L.ROLE_PLAYER}</option>
      <option value="moderator" ${u.role==='moderator'?'selected':''}>${L.ROLE_MOD}</option>
    </select>
    <button class="btn wfull" data-act="applyUser" data-id="${u.tgId}">${L.APPLY}</button>
  </div>`:''}`;
}
function findUser(){
  const id=Math.floor(Number($('#uSearch').value)||0);
  S.searchId=id||''; S.foundUser=null;
  if(!id){ toast(L.BAD_AMOUNT,false); return; }
  db.ref('users/'+id).once('value').then(s=>{
    if(s.exists()){ const v=s.val(); S.foundUser={tgId:id, name:v.name, gold:v.gold, role:v.role||'player'}; }
    else toast(L.USER_NOT_FOUND,false);
    render();
  });
}
function applyUser(id){
  db.ref('users/'+id).update({
    name:($('#uName').value||'').trim()||('ID '+id),
    gold:Math.floor(Number($('#uGold').value)||0),
    role:$('#uRole').value
  });
  toast(L.SAVED,true); render();
}

/* ---- админ: казна ---- */
function adEcon(){
  const h=(S.cfg&&S.cfg.house)||{};
  const inc=h.income||0, exp=h.expense||0;
  return `<div class="card">
    <div class="stat"><span>${L.INCOME}</span><b>${curIco()} ${fmt(inc)}</b></div>
    <div class="stat"><span>${L.EXPENSE}</span><b>${curIco()} ${fmt(exp)}</b></div>
    <div class="stat"><span>${L.PROFIT}</span><b style="color:${inc-exp>=0?'var(--ok)':'var(--bad)'}">${curIco()} ${fmt(inc-exp)}</b></div>
    <div class="stat"><span>${L.EDGE}</span><b>5%</b></div>
  </div>
  <p class="dim" style="font-size:12px;line-height:1.5">Апгрейдер устроен так: шанс = 95% ÷ множитель. Ожидаемый возврат игроку — 95% ставки, 5% остаётся проекту. Доход считается с проигрышей и покупок кейсов, расход — с выигрышей и продаж.</p>`;
}

/* ---- админ: настройки (иконка валюты/баланса) ---- */

  return `<div class="form">
    <label class="flabel">${L.CURRENCY_ICON}</label>
    <label class="filebtn">${L.CURRENCY_ICON}<input type="file" accept="image/*" onchange="pickImg(event,'cur')"></label>

function saveCurIcon(){
  if(!S.pend.cur){ toast(L.LOADIMG,false); return; }
  db.ref('config/currencyIcon').set(S.pend.cur);
  S.pend.cur=null; toast(L.CUR_SET,true); render();
}
