<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZombixUP</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root { --bg:#0b0b0b; --card:#171717; --text:#f5f5f5; --muted:#8d8d8d; --line:#2c2c2c; --accent:#fff; --green:#4caf50; --red:#ef5350; }
  html, body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; height:100%; overflow:hidden; }

  #auth-screen { position:fixed; inset:0; background:radial-gradient(circle at 50% 0%, #1e1e1e, #0b0b0b 70%); z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  #auth-screen.show { display:flex; }
  #auth-screen h1 { font-size:30px; letter-spacing:3px; margin-bottom:4px; }
  #auth-screen .sub { color:var(--muted); font-size:13px; margin-bottom:26px; }
  #auth-screen .card { width:100%; max-width:340px; animation:rise .4s ease; }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

  .app { height:100vh; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); background:#101010; z-index:10; }
  .logo { font-weight:800; letter-spacing:1.5px; font-size:16px; }
  .logo span { color:var(--muted); font-weight:400; font-size:11px; display:block; letter-spacing:0; margin-top:2px; }
  .balance { font-size:17px; font-weight:700; display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); padding:8px 12px; border-radius:20px; }
  .balance small { color:var(--muted); font-weight:400; }
  #cur-icon { width:20px; height:20px; border-radius:50%; object-fit:cover; display:none; }
  .burger { background:var(--card); border:1px solid var(--line); color:var(--text); width:42px; height:40px; border-radius:10px; font-size:17px; cursor:pointer; transition:.2s; }
  .burger:active { transform:scale(.92); }

  .menu-panel { background:var(--card); border-bottom:1px solid var(--line); max-height:0; overflow:hidden; transition:max-height .35s cubic-bezier(.4,0,.2,1); }
  .menu-panel.open { max-height:420px; }
  .menu-inner { display:flex; flex-wrap:wrap; gap:8px; padding:14px 16px; }
  .nav-item { background:#111; border:1px solid var(--line); color:var(--text); padding:10px 14px; border-radius:10px; cursor:pointer; font-size:14px; transition:.2s; user-select:none; }
  .nav-item:hover { border-color:#555; }
  .nav-item:active { transform:scale(.95); }
  .nav-item.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }

  main { padding:16px; overflow-y:auto; flex:1; }
  .tab-anim { animation:tabIn .3s ease; }
  @keyframes tabIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .badge { display:inline-block; background:var(--accent); color:#000; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-top:8px; }
  .badge.mod { background:var(--green); color:#fff; }
  .status { font-size:13px; padding:5px 0; }
  .ok { color:var(--green); } .err { color:var(--red); }
  .divider { border:none; border-top:1px solid var(--line); margin:12px 0; }

  input, select, button, textarea { font-size:14px; }
  input, select, textarea { width:100%; background:#101010; border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:10px; margin:4px 0 10px; transition:border-color .2s; outline:none; font-family:inherit; }
  input:focus, select:focus, textarea:focus { border-color:#666; }
  input[type=checkbox] { width:auto; }
  input[type=file] { padding:6px; color:var(--muted); }
  label { font-size:12px; color:var(--muted); }
  .btn { background:var(--accent); color:#000; border:none; padding:12px 14px; border-radius:10px; font-weight:700; cursor:pointer; width:100%; transition:.2s; }
  .btn:hover { opacity:.85; }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.4; cursor:default; transform:none; }
  .btn.sec { background:transparent; color:var(--text); border:1px solid var(--line); font-weight:400; }
  .btn.sec:hover { border-color:#555; opacity:1; }
  .btn.small { width:auto; padding:8px 12px; font-size:13px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .del { background:transparent; border:1px solid var(--red); color:var(--red); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:12px; transition:.2s; }
  .del:active { transform:scale(.94); }

  .item-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .item-card { background:#111; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; transition:.25s; }
  .item-card:hover { border-color:#555; transform:translateY(-2px); }
  .item-card.wide { grid-column:span 2; text-align:left; }
  .item-card img { width:56px; height:56px; object-fit:contain; }
  .item-card .nm { font-size:13px; margin:8px 0 2px; word-break:break-word; }
  .chips { font-size:11px; color:var(--muted); }
  .cmini { width:12px; height:12px; border-radius:50%; object-fit:cover; vertical-align:middle; }
  .price-tag { font-weight:700; font-size:13px; margin-top:2px; }
  .free { color:var(--green); font-weight:700; }
  .cat-title { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:18px 0 8px; }
  .preview { width:64px; height:64px; border-radius:12px; border:1px solid var(--line); object-fit:cover; margin-top:8px; }

  /* ---------- ОБЪЯВЛЕНИЯ ---------- */
  .ann-wrap { position:relative; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card); margin-bottom:14px; touch-action:pan-y; }
  .ann-track { display:flex; transition:transform .55s cubic-bezier(.4,0,.2,1); }
  .ann-slide { min-width:100%; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .ann-slide img { width:100%; max-height:170px; object-fit:cover; border-radius:10px; }
  .ann-slide .atext { font-size:14px; line-height:1.45; word-break:break-word; }
  .ann-btn { display:inline-block; background:var(--accent); color:#000; font-weight:700; font-size:13px; padding:9px 16px; border-radius:10px; text-decoration:none; text-align:center; transition:.2s; }
  .ann-btn:active { transform:scale(.96); }
  .ann-nav { position:absolute; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:1px solid var(--line); font-size:15px; cursor:pointer; z-index:5; transition:.2s; }
  .ann-nav:active { transform:translateY(-50%) scale(.88); }
  .ann-nav.l { left:8px; } .ann-nav.r { right:8px; }
  .ann-dots { display:flex; gap:6px; justify-content:center; padding:10px 0 12px; }
  .ann-dot { width:8px; height:8px; border-radius:50%; background:#333; border:none; cursor:pointer; transition:.3s; padding:0; }
  .ann-dot.on { background:var(--accent); width:20px; border-radius:6px; }

  /* ---------- ПРОКРУТКА КЕЙСА ---------- */
  #case-modal { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:400; display:none; align-items:center; justify-content:center; flex-direction:column; padding:24px; }
  #case-modal.show { display:flex; }
  .cm-box { display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; max-width:420px; }
  .rl-window { overflow:hidden; border:1px solid var(--line); border-radius:14px; background:#0f0f0f; position:relative; height:130px; width:100%; }
  .rl-window::before, .rl-window::after { content:''; position:absolute; top:0; bottom:0; width:18%; z-index:5; pointer-events:none; }
  .rl-window::before { left:0; background:linear-gradient(90deg, #0f0f0f, transparent); }
  .rl-window::after { right:0; background:linear-gradient(-90deg, #0f0f0f, transparent); }
  .rl-marker { position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:#fff; z-index:6; box-shadow:0 0 12px rgba(255,255,255,.8); }
  .rl-strip { display:flex; gap:10px; padding:15px 0; align-items:center; will-change:transform; }
  .rl-item { width:100px; flex:0 0 100px; height:100px; background:#1a1a1a; border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; will-change:transform; }
  .rl-item img { width:44px; height:44px; object-fit:contain; pointer-events:none; }
  .rl-item span { font-size:9px; color:var(--muted); text-align:center; padding:0 4px; word-break:break-word; pointer-events:none; }
  .cm-prize { opacity:0; transform:scale(.3); margin-top:16px; }
  .cm-prize.show { animation:prizeIn .55s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes prizeIn { to { opacity:1; transform:scale(1); } }
  .cm-prize .frame { width:150px; height:150px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle, #2a2a2a, #101010); border:2px solid #fff; box-shadow:0 0 40px rgba(255,255,255,.55), 0 0 80px rgba(255,255,255,.25); animation:glowPulse 1.8s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100% { box-shadow:0 0 30px rgba(255,255,255,.4), 0 0 70px rgba(255,255,255,.15); } 50% { box-shadow:0 0 50px rgba(255,255,255,.75), 0 0 100px rgba(255,255,255,.3); } }
  .cm-prize .frame img { width:88px; height:88px; object-fit:contain; }
  .cm-prize .pn { font-size:17px; font-weight:700; margin-top:12px; }
  .cm-prize .pp { color:var(--muted); font-size:13px; margin-top:2px; }

  /* ---------- ТИКЕТЫ И ЧАТ ---------- */
  .ticket-row { background:#111; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
  .ticket-row .tnum { font-weight:700; font-size:14px; }
  .ts-open { color:var(--green); } .ts-taken { color:#ffb74d; } .ts-closed { color:var(--muted); }
  .chat { display:flex; flex-direction:column; gap:8px; max-height:320px; overflow-y:auto; padding:4px 0; }
  .msg { max-width:80%; padding:8px 12px; border-radius:12px; font-size:13px; word-break:break-word; animation:msgIn .25s ease; }
  @keyframes msgIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .msg.own { align-self:flex-end; background:var(--accent); color:#000; border-bottom-right-radius:4px; }
  .msg.them { align-self:flex-start; background:#222; border-bottom-left-radius:4px; }
  .msg .who { font-size:10px; opacity:.65; margin-bottom:2px; }
  .tx-box { background:#101010; border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
  .tx-box label { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); cursor:pointer; }

  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(80px); background:#f5f5f5; color:#000; padding:11px 18px; border-radius:12px; font-size:14px; font-weight:600; z-index:600; opacity:0; transition:.35s; max-width:86%; text-align:center; }
  #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  .admin-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .admin-tabs .btn.sec { padding:9px 12px; font-size:13px; white-space:nowrap; }
  .admin-tabs .btn.sec.on { background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }
  .subtabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .subtabs button { background:#111; border:1px solid var(--line); color:var(--text); padding:7px 12px; border-radius:8px; font-size:13px; cursor:pointer; }
  .subtabs button.on { background:var(--accent); color:#000; font-weight:700; }
</style>
</head>
<body>

<div id="auth-screen">
  <h1>ZombixUP</h1>
  <p class="sub">Вход по Telegram ID и паролю</p>
  <div class="card">
    <label>Telegram ID (только цифры)</label>
    <input id="a-id" inputmode="numeric" placeholder="8158896250">
    <label>Пароль (мин. 6 символов)</label>
    <input id="a-pass" type="password">
    <p class="muted" id="a-msg" style="margin:6px 0 4px; min-height:18px"></p>
    <button class="btn" onclick="doAuth()">Войти / Зарегистрироваться</button>
    <p class="muted" style="margin-top:10px">Если аккаунта с таким ID ещё нет — он создастся автоматически.</p>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <header>
    <div class="logo">ZombixUP<span id="page-title">Главная</span></div>
    <div class="balance">
      <small>Баланс</small>
      <img id="cur-icon" alt="">
      <span id="balance">…</span>
    </div>
    <button class="burger" onclick="toggleMenu()">☰</button>
  </header>

  <nav class="menu-panel" id="menu-panel">
    <div class="menu-inner">
      <a class="nav-item active" data-tab="home"     onclick="go('home')">🏠 Главная</a>
      <a class="nav-item" data-tab="cases"     onclick="go('cases')">📦 Кейсы</a>
      <a class="nav-item" data-tab="inventory" onclick="go('inventory')">🎒 Инвентарь</a>
      <a class="nav-item" data-tab="profile"   onclick="go('profile')">👤 Профиль</a>
      <a class="nav-item" data-tab="settings"  onclick="go('settings')">⚙️ Настройки</a>

      <a class="nav-item" id="admin-btn" style="display:none" onclick="go('admin')">🛠 Админ-панель</a>

  </nav>

  <main id="content">
    <div class="card">
      <h2>Статус</h2>
      <div class="status" id="s-auth">Авторизация…</div>
      <div class="status" id="s-db">База данных…</div>
    </div>
  </main>
</div>

<div id="case-modal"><div class="cm-box" id="cm-box"></div></div>
<div id="toast"></div>

<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyB9uAa0NjkxMvjK0ZrGGHBtksWWRZA2cPs",
  authDomain: "syq-site.firebaseapp.com",
  databaseURL: "https://syq-site-default-rtdb.firebaseio.com",
  projectId: "syq-site",
  storageBucket: "syq-site.firebasestorage.app",
  messagingSenderId: "309704145783",
  appId: "1:309704145783:web:3d525163e0fbb1f7723f72",
  measurementId: "G-QV7MG6M9V4"
};

const ADMIN_ID = '8158896250';

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const TG_USER = tg.initDataUnsafe?.user || null;
const TG_ID = TG_USER ? String(TG_USER.id) : null;

let CURRENT_ID = null, CURRENT_PASS = null, profileRef = null, profile = null;
const WORKER_URL = 'https://strike-arena-kv.mirikpirik2009.workers.dev';
async function workerRequest(path, payload = {}) {
  if (!CURRENT_ID || !CURRENT_PASS) throw new Error('Сессия не подтверждена. Войдите заново.');
  if (WORKER_URL.includes('YOUR-WORKER')) throw new Error('Укажи URL Cloudflare Worker в WORKER_URL в index.html');
  const response = await fetch(WORKER_URL + path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id:CURRENT_ID, password:CURRENT_PASS, ...payload }) });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || !data.ok) throw new Error(data.error || 'Ошибка серверной операции');
  return data;
}
let ITEMS = {}, CATS = {}, CASES = {}, USERS = {}, TICKETS = {}, ROLES = {}, ANNS = {};
let CUR_ICON = '', CUR_DRAFT = '';
let CURRENT_TAB = 'home', adminSub = 'items', draft = null;
let ticketSubTab = 'open', OPEN_TICKET_ID = null, profileTicketTab = 'open', ticketSearch = '';
let ANN_EDIT = null, ANN_DRAFT = null;
let annIndex = 0, annTimer = null, annCount = 0;
const IMG_SIZE = 128;
const DAY = 24 * 3600 * 1000;

/* ---------- утилиты ---------- */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const pcur = n => `${CUR_ICON ? `<img class="cmini" src="${CUR_ICON}">` : ''} ${n}`;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2400);
}
function toggleMenu() { document.getElementById('menu-panel').classList.toggle('open'); }
function isAdmin() { return (profile && profile.is_admin === true) || CURRENT_ID === ADMIN_ID; }
function isStaff() { return isAdmin() || ROLES[CURRENT_ID] === 'moderator'; }
function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' }) + ' ' +
         d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}
const TITLES = { home:'Главная', cases:'Кейсы', inventory:'Инвентарь', profile:'Профиль', settings:'Настройки', tickets:'Тикеты', admin:'Админ-панель' };

function fileToDataUrl(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = IMG_SIZE;
      c.getContext('2d').drawImage(img, 0, 0, IMG_SIZE, IMG_SIZE);
      cb(c.toDataURL('image/png'));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
/* фото объявления — сжимаем до 800px по ширине (объявления шире иконок) */
function fileToPhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const w = Math.min(800, img.width);
      const c = document.createElement('canvas');
      c.width = w; c.height = Math.round(img.height * w / img.width);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.75));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- ВХОД ---------- */
function aMsg(t, cls) {
  const m = document.getElementById('a-msg');
  m.textContent = t; m.style.color = cls === 'err' ? '#ef5350' : '#8d8d8d';
}
async function doAuth() {
  const id = document.getElementById('a-id').value.trim();
  const pass = document.getElementById('a-pass').value;
  if (!/^\d{4,}$/.test(id)) return aMsg('ID должен быть числом', 'err');
  if (pass.length < 6) return aMsg('Пароль минимум 6 символов', 'err');
  if (WORKER_URL.includes('YOUR-WORKER')) return aMsg('Сначала настрой URL Cloudflare Worker в index.html', 'err');
  try {
    const cred = await auth.signInAnonymously();
    const idToken = await cred.user.getIdToken();
    CURRENT_PASS = pass;
    const callSession = async (register = false, bootstrapSecret = '') => {
      const response = await fetch(WORKER_URL + '/api/session', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ id, password:pass, uid:cred.user.uid, idToken, register, bootstrapSecret })
      });
      return { response, data: await response.json().catch(() => ({})) };
    };
    let result = await callSession(false);
    if (!result.response.ok && result.data.code === 'ACCOUNT_MISSING') {
      if (!confirm('Такого ID ещё нет. Зарегистрировать новый аккаунт?')) return;
      let bootstrapSecret = '';
      if (id === ADMIN_ID) bootstrapSecret = prompt('Для первичной регистрации администратора введи ADMIN_BOOTSTRAP_SECRET из настроек Worker:') || '';
      result = await callSession(true, bootstrapSecret);
    }
    if (!result.response.ok || !result.data.ok) return aMsg(result.data.error || 'Не удалось войти', 'err');
    CURRENT_ID = id;
    enterApp(id);
  } catch (e) { aMsg('Ошибка входа: ' + e.message, 'err'); }
}
/* ---------- СТАРТ ---------- */
async function enterApp(id) {
  CURRENT_ID = id;
  document.getElementById('auth-screen').classList.remove('show');
  document.getElementById('app').style.display = 'flex';

  profileRef = db.ref('users/' + id);
  const snap = await profileRef.get();
  if (!snap.exists()) {
    await profileRef.child('tgId').set(id);
    await profileRef.child('name').set((TG_USER && String(TG_USER.id) === id) ? TG_USER.first_name : id);
    await profileRef.child('createdAt').set(Date.now());
  } else if (id === ADMIN_ID && snap.val().is_admin !== true) {
    // is_admin выставляется только вручную в базе или сервером.
  }

  profileRef.on('value', s => {
    profile = s.val() || {};
    document.getElementById('balance').textContent = profile.balance ?? 0;
    document.getElementById('admin-btn').style.display = isAdmin() ? 'block' : 'none';
    updateStaffBtn();
    const sDb = document.getElementById('s-db');

function annUpdate() {

}
function annSlide(dir) { annIndex = (annIndex + dir + annCount) % annCount; annUpdate(); restartAnnTimer(); }
function annGo(i) { annIndex = i; annUpdate(); restartAnnTimer(); }
function startAnnRotator() {
  clearInterval(annTimer);

  annTimer = setInterval(() => { if (document.getElementById('ann-track')) annSlide(1); else clearInterval(annTimer); }, 10000);
}
function restartAnnTimer() { clearInterval(annTimer); annTimer = setInterval(() => { if (document.getElementById('ann-track')) annSlide(1); else clearInterval(annTimer); }, 10000); }
/* свайп пальцем */
document.addEventListener('touchstart', e => {
  const w = e.target.closest?.('#ann-wrap');
  if (w) { window._annX = e.touches[0].clientX; }
}, { passive: true });

/* ---------- ПРОКРУТКА ---------- */
const STEP = 110, ITEM_W = 100;
function showCaseRoulette(k, winnerId) {
  const modal = document.getElementById('case-modal');
  const box = document.getElementById('cm-box');
  box.innerHTML = `
    <p class="muted" style="margin-bottom:14px">${esc(k.name)}</p>
    <div class="rl-window"><div class="rl-marker"></div><div class="rl-strip" id="rl-strip"></div></div>`;
  modal.classList.add('show');

  const pool = Object.keys(k.items || {}).filter(id => ITEMS[id]);
  const ids = pool.length ? pool : Object.keys(ITEMS).length ? Object.keys(ITEMS) : [winnerId];
  const seq = [];
  for (let i = 0; i < 48; i++) seq.push(ids[Math.floor(Math.random() * ids.length)]);
  seq[40] = winnerId;
  const strip = document.getElementById('rl-strip');
  strip.innerHTML = seq.map(id => {
    const it = ITEMS[id] || {};
    return `<div class="rl-item">${it.img ? `<img src="${esc(it.img)}">` : '<span>🎁</span>'}
      <span>${esc(it.name || id)}</span></div>`;
  }).join('');

  const winW = box.querySelector('.rl-window').clientWidth;
  const targetX = 40 * STEP - winW / 2 + ITEM_W / 2;
  const DURATION = 5200;
  const items = [...strip.children];
  let start = null;

  function frame(now) {
    if (!start) start = now;
    const t = Math.min(1, (now - start) / DURATION);
    const ease = 1 - Math.pow(1 - t, 4);
    const x = -targetX * ease;
    strip.style.transform = `translateX(${x}px)`;
    items.forEach((el, i) => {
      const center = i * STEP + ITEM_W / 2 + x;
      const dist = Math.abs(center - winW / 2);
      const scale = 1 + 0.45 * Math.max(0, 1 - dist / 80);
      el.style.transform = `scale(${scale})`;
      el.style.zIndex = Math.round(scale * 10);
    });
    if (t < 1) requestAnimationFrame(frame);
    else setTimeout(() => showPrize(k, winnerId), 450);
  }
  requestAnimationFrame(frame);
}
function showPrize(k, winnerId) {
  const win = ITEMS[winnerId] || {};
  const box = document.getElementById('cm-box');
  box.innerHTML = `
    <p class="muted" style="margin-bottom:6px">Вам выпало</p>
    <div class="cm-prize" id="cm-prize">
      <div class="frame">${win.img ? `<img src="${esc(win.img)}">` : '🎁'}</div>
      <div class="pn">${esc(win.name || 'Предмет')}</div>
      <div class="pp">${win.price > 0 ? `Стоимость: ${win.price}` : 'Без цены'}</div>
    </div>
    <button class="btn" style="max-width:220px; margin-top:22px" onclick="closeCaseModal()">Забрать в инвентарь</button>`;
  requestAnimationFrame(() => document.getElementById('cm-prize').classList.add('show'));
}

const TYPE_NAME = { deposit: 'Пополнение', withdraw: 'Вывод' };
const tStatusHTML = s => s === 'open' ? '<span class="ts-open">Открыт</span>' : s === 'taken' ? '<span class="ts-taken">Взят</span>' : '<span class="ts-closed">Закрыт</span>';

async function createTicket(type, amount) {
  const ref = db.ref('tickets').push();
  const numSnap = await db.ref('counters/ticketNum').transaction(v => (v || 0) + 1);
  await ref.set({
    num: numSnap.snapshot.val(), owner: CURRENT_ID,
    ownerName: profile?.name || CURRENT_ID,
    type, amount: +amount || 0, status: 'open',
    createdAt: Date.now(), messages: {}
  });
  OPEN_TICKET_ID = ref.key;
  toast(`Тикет #${numSnap.snapshot.val()} создан`);
}
function sendMsg(id, inputId) {
  const inp = document.getElementById(inputId);
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  db.ref('tickets/' + id + '/messages').push().set({
    from: CURRENT_ID, name: profile?.name || CURRENT_ID,
    role: isAdmin() ? 'admin' : (ROLES[CURRENT_ID] === 'moderator' ? 'moderator' : 'player'),
    text, at: Date.now()
  });
}
async function takeTicket(id) {
  try { const result = await workerRequest('/api/ticket/take', { ticketId:id }); OPEN_TICKET_ID = id; toast(result.message || 'Тикет взят'); }
  catch (e) { toast(e.message || 'Не удалось взять тикет'); }
}

async function closeTicket(id) {
  const t = TICKETS[id];
  if (!t || !isStaff()) return toast('Нет доступа к тикету');
  if (t.status === 'closed') return toast('Тикет уже закрыт');
  if (t.status !== 'taken' || t.takenBy !== CURRENT_ID) return toast('Сначала возьми этот тикет в работу');
  const approve = document.getElementById('tx-apply')?.checked === true;
  const reasonInput = prompt('Причина закрытия тикета:', approve ? 'Подтверждено' : 'Отклонено/закрыто без операции');
  if (reasonInput === null) return;
  const reason = reasonInput.trim(); if (!reason) return toast('Укажи причину закрытия');
  try {
    await workerRequest('/api/ticket/close', { ticketId:id, approve, reason });
    toast(approve ? 'Заявка подтверждена сервером' : 'Тикет закрыт без изменения баланса');
    OPEN_TICKET_ID = null; rerender();
  } catch (e) { toast(e.message || 'Не удалось обработать тикет'); }
}

      <input placeholder="Поиск по номеру тикета…" value="${esc(ticketSearch)}" oninput="ticketSearch=this.value; rerender()">
      <div class="subtabs">
        <button class="${ticketSubTab === 'open' ? 'on' : ''}" onclick="setSub2('open')">Не выполненные (${open.length})</button>
        <button class="${ticketSubTab === 'mine' ? 'on' : ''}" onclick="setSub2('mine')">Текущие (${mine.length})</button>
        <button class="${ticketSubTab === 'closed' ? 'on' : ''}" onclick="setSub2('closed')">Закрытые (${closed.length})</button>
      </div>
      ${ticketSubTab === 'open' ? (open.map(([id, t]) =>
        ticketRowHTML(id, t, { action: 'uiTake', label: 'Взять' })).join('') || '<p class="muted">Свободных тикетов нет.</p>') : ''}
      ${ticketSubTab === 'mine' ? (mine.map(([id, t]) =>
        ticketRowHTML(id, t, { action: 'openStaffTicket', label: 'Открыть' })).join('') || '<p class="muted">Нет активных тикетов.</p>') : ''}
      ${ticketSubTab === 'closed' ? (closed.map(([id, t]) =>
        ticketRowHTML(id, t, { action: 'openStaffTicket', label: 'Открыть' })).join('') || '<p class="muted">Пока нет закрытых.</p>') : ''}
    </div>`;
}
function setSub2(v) { ticketSubTab = v; OPEN_TICKET_ID = null; rerender(); }
function backToStaff() { OPEN_TICKET_ID = null; rerender(); }
function openStaffTicket(id) { OPEN_TICKET_ID = id; rerender(); }
function uiTake(id) { takeTicket(id).then(rerender); }

/* ---------- АДМИН-ПАНЕЛЬ ---------- */
function renderAdmin(c) {
  c.innerHTML = `
    <div class="card">
      <div class="admin-tabs">
        <button class="btn sec ${adminSub==='items'?'on':''}" onclick="setSub('items')">📚 Предметы</button>
        <button class="btn sec ${adminSub==='cats'?'on':''}" onclick="setSub('cats')">🗂 Категории</button>
        <button class="btn sec ${adminSub==='cases'?'on':''}" onclick="setSub('cases')">📦 Кейсы</button>
        <button class="btn sec ${adminSub==='users'?'on':''}" onclick="setSub('users')">👥 Игроки</button>
        <button class="btn sec ${adminSub==='anns'?'on':''}" onclick="setSub('anns')">📢 Объявления</button>
        <button class="btn sec ${adminSub==='cur'?'on':''}" onclick="setSub('cur')">🪙 Валюта</button>
      </div>
    </div>
    <div id="admin-body"></div>`;
  drawAdminBody();
}
function setSub(s) { adminSub = s; drawAdminBody(); }
function drawAdminBody() {
  const b = document.getElementById('admin-body');
  if (!b) return;
  if (adminSub === 'items') b.innerHTML = adminItemsHTML();
  if (adminSub === 'cats')  b.innerHTML = adminCatsHTML();
  if (adminSub === 'cases') b.innerHTML = adminCasesHTML();
  if (adminSub === 'users') b.innerHTML = adminUsersHTML();
  if (adminSub === 'anns')  b.innerHTML = adminAnnsHTML();
  if (adminSub === 'cur')   b.innerHTML = adminCurHTML();
}

/* --- Предметы --- */
function adminItemsHTML() {
  return `<div class="card"><h2>➕ Новый предмет</h2>
    <label>Название</label><input id="it-name">
    <label>Иконка (загрузи файл или вставь ссылку)</label>
    <input type="file" accept="image/*" onchange="onItemFile(event)">
    <p class="muted" style="text-align:center; margin:4px 0">или</p>
    <input id="it-img" placeholder="https://...">
    <img id="it-prev" class="preview" style="display:none">
    <label>Цена</label><input id="it-price" type="number" value="0">
    <label><input type="checkbox" id="it-sell" checked> Можно продавать</label>
    <button class="btn" onclick="addItem()">Создать предмет</button></div>
  <div class="card"><h2>📚 Предметы (${Object.keys(ITEMS).length})</h2>
    <div class="item-grid">${Object.entries(ITEMS).map(([id, it]) =>
      `<div class="item-card">${it.img ? `<img src="${esc(it.img)}">` : ''}
        <div class="nm">${esc(it.name)}</div>
        <div class="chips">${it.price} · ${it.sellable ? 'продаётся' : 'не продаётся'}</div>
        <button class="del" style="margin-top:8px" onclick="delItem('${id}')">Удалить</button></div>`).join('')}
    </div></div>`;
}
function onItemFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  fileToDataUrl(f, url => {
    document.getElementById('it-img').value = url;
    const p = document.getElementById('it-prev');
    p.src = url; p.style.display = 'block';
    toast('Картинка загружена');
  });
}
async function addItem() {
  const name = document.getElementById('it-name').value.trim();
  if (!name) return toast('Введи название');
  await db.ref('items').push().set({
    name, img: document.getElementById('it-img').value.trim(),
    price: +document.getElementById('it-price').value || 0,
    sellable: document.getElementById('it-sell').checked ? 1 : 0
  });
  toast('Предмет создан');
  drawAdminBody();
}
async function delItem(id) { if (confirm('Удалить предмет?')) { await db.ref('items/' + id).remove(); drawAdminBody(); } }

/* --- Категории --- */
function adminCatsHTML() {
  return `<div class="card"><h2>➕ Новая категория</h2>
    <label>Название</label><input id="cat-name">
    <button class="btn" onclick="addCat()">Создать категорию</button></div>
  <div class="card"><h2>🗂 Категории (${Object.keys(CATS).length})</h2>
    ${Object.entries(CATS).map(([id, c]) =>
      `<div class="row" style="align-items:center; margin-bottom:6px">
        <p style="flex:1">${esc(c.name)}</p><button class="del" onclick="delCat('${id}')">Удалить</button></div>`).join('') || '<p class="muted">Пока нет.</p>'}
    <hr class="divider"><p class="muted">Кейсы без категории автоматически попадают в раздел «Общая» в магазине.</p>
  </div>`;
}
async function addCat() {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) return toast('Введи название');
  await db.ref('categories').push().set({ name });
  toast('Категория создана');
  drawAdminBody();
}
async function delCat(id) { if (confirm('Удалить категорию?')) { await db.ref('categories/' + id).remove(); drawAdminBody(); } }

/* --- Кейсы --- */
function adminCasesHTML() {
  if (!draft) draft = { name:'', img:'', price:0, category:'', totalLimit:0, perUserLimit:0, hours:0, items:[] };
  return `<div class="card"><h2>➕ Новый кейс</h2>
    <label>Название</label><input id="cs-name" value="${esc(draft.name)}">
    <label>Иконка кейса (файл или ссылка)</label>
    <input type="file" accept="image/*" onchange="onCaseFile(event)">
    <p class="muted" style="text-align:center; margin:4px 0">или</p>
    <input id="cs-img" value="${esc(draft.img)}" placeholder="https://...">
    <img id="cs-prev" class="preview" style="${draft.img ? '' : 'display:none'}" src="${esc(draft.img)}">
    <label>Стоимость (0 = бесплатный кейс)</label><input id="cs-price" type="number" value="${draft.price}">
    <label>Категория (необязательно — иначе «Общая»)</label><select id="cs-cat">
      <option value="">— Общая —</option>
      ${Object.entries(CATS).map(([id, c]) => `<option value="${id}" ${draft.category === id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
    </select>
    <div class="row">
      <div><label>Всего открытий (0 = ∞)</label><input id="cs-total" type="number" value="${draft.totalLimit}"></div>
      <div><label>Лимит на игрока (0 = ∞)</label><input id="cs-per" type="number" value="${draft.perUserLimit}"></div>
    </div>
    <label>Исчезнет через (часов, 0 = никогда)</label><input id="cs-hours" type="number" value="${draft.hours}">
    <hr class="divider">
    <label>Предметы и шансы</label>
    <div class="row">
      <select id="cs-item">${Object.entries(ITEMS).map(([id, it]) => `<option value="${id}">${esc(it.name)}</option>`).join('')}</select>
      <input id="cs-chance" type="number" placeholder="Шанс, %" value="10" style="flex:0 0 90px">
      <button class="btn sec" style="flex:0 0 auto; padding:10px" onclick="draftAddItem()">+</button>
    </div>
    ${draft.items.map((d, i) => `<div class="row" style="align-items:center">
      <p style="flex:1">${ITEMS[d.id]?.img ? `<img class="cmini" src="${esc(ITEMS[d.id].img)}" style="border-radius:4px">` : ''} ${esc(ITEMS[d.id]?.name || d.id)} — <b>${d.chance}%</b></p>
      <button class="del" onclick="draftRemove(${i})">✕</button></div>`).join('') || '<p class="muted">Добавь хотя бы один предмет.</p>'}
    <button class="btn" style="margin-top:10px" onclick="saveCase()">Создать кейс</button></div>
  <div class="card"><h2>📦 Кейсы (${Object.keys(CASES).length})</h2>
    ${Object.entries(CASES).map(([id, k]) =>
      `<div class="row" style="align-items:center; margin-bottom:6px">
        <p style="flex:1">${k.img ? `<img class="cmini" src="${esc(k.img)}" style="border-radius:4px">` : ''} ${esc(k.name)} · ${k.price > 0 ? k.price : 'бесплатно'} · открыто: ${k.opened || 0}</p>
        <button class="del" onclick="delCase('${id}')">Удалить</button></div>`).join('') || '<p class="muted">Пока нет.</p>'}
  </div>`;
}
function readDraft() {
  draft.name = document.getElementById('cs-name').value;
  draft.img = document.getElementById('cs-img').value.trim();
  draft.price = +document.getElementById('cs-price').value || 0;
  draft.category = document.getElementById('cs-cat').value;
  draft.totalLimit = +document.getElementById('cs-total').value || 0;
  draft.perUserLimit = +document.getElementById('cs-per').value || 0;
  draft.hours = +document.getElementById('cs-hours').value || 0;
}
function onCaseFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  fileToDataUrl(f, url => {
    draft.img = url;
    drawAdminBody();
    toast('Картинка загружена');
  });
}
function draftAddItem() {
  const id = document.getElementById('cs-item').value;
  const chance = +document.getElementById('cs-chance').value || 0;
  if (!id || chance <= 0) return toast('Выбери предмет и шанс больше 0');
  readDraft();
  draft.items.push({ id, chance });
  drawAdminBody();
}
function draftRemove(i) { readDraft(); draft.items.splice(i, 1); drawAdminBody(); }
async function saveCase() {
  readDraft();
  if (!draft.name.trim()) return toast('Введи название');
  if (draft.items.length === 0) return toast('Добавь предметы в кейс');
  await db.ref('cases').push().set({
    name: draft.name.trim(), img: draft.img,
    category: draft.category,
    price: draft.price, totalLimit: draft.totalLimit, perUserLimit: draft.perUserLimit,
    expiresAt: draft.hours ? Date.now() + draft.hours * 3600000 : 0,
    opened: 0,
    items: Object.fromEntries(draft.items.map(d => [d.id, d.chance])),
    createdAt: Date.now()
  });
  draft = null;
  toast('Кейс создан!');
  drawAdminBody();
}
async function delCase(id) { if (confirm('Удалить кейс?')) { await db.ref('cases/' + id).remove(); drawAdminBody(); } }

/* --- Игроки и роли --- */
function adminUsersHTML() {
  return `<div class="card"><h2>👥 Игроки (${Object.keys(USERS).length})</h2>
    <p class="muted">Модератор видит вкладку «Тикеты» и может брать и закрывать тикеты игроков.</p>
    ${Object.entries(USERS).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || '')).map(([id, u]) =>
      `<div class="row" style="align-items:center; margin-bottom:8px">
        <div style="flex:1">
          <div style="font-size:14px">${esc(u.name || id)} ${u.is_admin ? '<span class="badge" style="margin:0">АДМИН</span>' : ''} ${ROLES[id] === 'moderator' ? '<span class="badge mod" style="margin:0">МОД</span>' : ''}</div>
          <div class="chips">ID: ${id} · баланс: ${u.balance ?? 0}</div>
        </div>
        ${u.is_admin ? '' : (ROLES[id] === 'moderator'
          ? `<button class="del" onclick="toggleMod('${id}', false)">Снять мода</button>`
          : `<button class="btn small" style="flex:0 0 auto" onclick="toggleMod('${id}', true)">Сделать модом</button>`)}
      </div>`).join('')}
  </div>`;
}
async function toggleMod(id, on) {
  if (on) await db.ref('roles/' + id).set('moderator');
  else await db.ref('roles/' + id).remove();
  toast(on ? 'Назначен модератором' : 'Роль снята');
}

/* --- Объявления --- */
function adminAnnsHTML() {
  const editing = ANN_EDIT && ANNS[ANN_EDIT];
  const cur = editing ? ANNS[ANN_EDIT] : (ANN_DRAFT || { text:'', img:'', btnName:'', btnLink:'' });
  return `<div class="card"><h2>➕ ${editing ? '✏️ Изменить объявление' : 'Новое объявление'}</h2>
    <label>Текст</label><textarea id="an-text" rows="3">${esc(cur.text)}</textarea>
    <label>Фото (необязательно)</label>
    <input type="file" accept="image/*" onchange="onAnFile(event)">
    <img id="an-prev" class="preview" style="width:100%; height:auto; max-height:120px; ${cur.img ? '' : 'display:none'}" src="${esc(cur.img)}">
    <label>Кнопка: название (необязательно)</label><input id="an-btn-name" value="${esc(cur.btnName)}" placeholder="Например: Наш канал">
    <label>Кнопка: ссылка</label><input id="an-btn-link" value="${esc(cur.btnLink)}" placeholder="https://...">
    <button class="btn" onclick="saveAnn()">${editing ? 'Сохранить изменения' : 'Создать объявление'}</button>
    ${editing ? '<button class="btn sec" style="margin-top:6px" onclick="cancelAnnEdit()">Отмена редактирования</button>' : ''}
    <hr class="divider">
    <p class="muted">Объявления показываются на главной каруселью: автолистование каждые 10 секунд, игрок может листать свайпом и стрелками.</p></div>
  <div class="card"><h2>📢 Объявления (${Object.keys(ANNS).length})</h2>
    ${Object.entries(ANNS).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)).map(([id, a]) =>
      `<div class="ticket-row">
        <div class="row" style="align-items:center">
          <div style="flex:1">
            <div style="font-size:13px">${esc(a.text.slice(0, 60))}${a.text.length > 60 ? '…' : ''}</div>
            <div class="chips">${a.img ? '📷 фото · ' : ''}${a.btnName ? `кнопка: ${esc(a.btnName)}` : 'без кнопки'}</div>
          </div>
          <button class="btn small" style="flex:0 0 auto" onclick="editAnn('${id}')">✏️</button>
          <button class="del" onclick="delAnn('${id}')">Удалить</button>
        </div></div>`).join('') || '<p class="muted">Пока нет объявлений.</p>'}
  </div>`;
}
function readAnnForm() {
  return {
    text: document.getElementById('an-text').value.trim(),
    img: document.getElementById('an-prev')?.src || '',
    btnName: document.getElementById('an-btn-name').value.trim(),
    btnLink: document.getElementById('an-btn-link').value.trim()
  };
}
function onAnFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  fileToPhoto(f, url => {
    const p = document.getElementById('an-prev');
    p.src = url; p.style.display = 'block';
    toast('Фото загружено');
  });
}
async function saveAnn() {
  const data = readAnnForm();
  if (!data.text) return toast('Введи текст объявления');
  if (data.btnName && !data.btnLink) return toast('Укажи ссылку для кнопки');
  const payload = { text: data.text, img: data.img, btnName: data.btnName, btnLink: data.btnLink };
  if (ANN_EDIT) {
    await db.ref('anns/' + ANN_EDIT).update(payload);
    ANN_EDIT = null;
    toast('Объявление обновлено');
  } else {
    await db.ref('anns').push().set({ ...payload, createdAt: Date.now() });
    toast('Объявление создано');
  }
  drawAdminBody();
}
function editAnn(id) { ANN_EDIT = id; drawAdminBody(); }
function cancelAnnEdit() { ANN_EDIT = null; drawAdminBody(); }
async function delAnn(id) {
  if (!confirm('Удалить объявление?')) return;
  await db.ref('anns/' + id).remove();
  if (ANN_EDIT === id) ANN_EDIT = null;
  toast('Объявление удалено');
  drawAdminBody();
}

/* --- Валюта --- */
function adminCurHTML() {
  return `<div class="card"><h2>🪙 Иконка валюты</h2>
    <p class="muted">Появится рядом с балансом и во всех ценах. Файл сжимается до 96×96 и хранится в базе.</p>
    <label>Файл (PNG / JPG)</label>
    <input type="file" accept="image/*" onchange="onCurFile(event)">
    <img id="cur-prev" class="preview" style="border-radius:50%; ${CUR_ICON ? '' : 'display:none'}" src="${CUR_ICON}">
    <button class="btn" style="margin-top:10px" id="cur-save" onclick="saveCur()" ${CUR_DRAFT ? '' : 'disabled'}>Сохранить иконку</button>
    ${CUR_ICON ? '<button class="btn sec" style="margin-top:6px" onclick="delCur()">Убрать иконку</button>' : ''}</div>`;
}
function onCurFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  fileToDataUrl(f, url => {
    CUR_DRAFT = url;
    const p = document.getElementById('cur-prev');
    p.src = url; p.style.display = 'block';
    document.getElementById('cur-save').disabled = false;
    toast('Картинка загружена');
  });
}
async function saveCur() {
  if (!CUR_DRAFT) return;
  await db.ref('config/currency').set({ icon: CUR_DRAFT, updatedAt: Date.now() });
  CUR_DRAFT = '';
  toast('Иконка сохранена');
  drawAdminBody();
}
async function delCur() { if (confirm('Убрать иконку валюты?')) { await db.ref('config/currency').remove(); CUR_DRAFT = ''; drawAdminBody(); } }
</script>
</body>
</html>
