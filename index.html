<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Star App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --panel2:#fafaf8; --text:#141414;
  --muted:#8a8a86; --border:#e4e4e0; --accent:#141414; --accent-text:#ffffff;
}
body[data-theme="dark"]{
  --bg:#141414; --panel:#1e1e1e; --panel2:#232323; --text:#f2f2f0;
  --muted:#9a9a96; --border:#31312e; --accent:#f2f2f0; --accent-text:#141414;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top); overscroll-behavior:none;
}
#appHeader{
  position:sticky; top:0; z-index:50;
  background:#101010; color:#fff;
  height:56px; display:flex; align-items:center;
  padding:0 16px 0 max(16px, env(safe-area-inset-left));
}
#appHeader .brand{font-weight:700; letter-spacing:.4px; font-size:17px}
#menuBtn{
  margin-left:auto; width:42px; height:42px; border-radius:50%;
  border:none; background:#fff; color:#101010;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.35);
  cursor:pointer; transition:transform .25s;
}
#menuBtn:active{transform:scale(.9)}
#menuBtn svg{transition:transform .3s}
body.menu-open #menuBtn svg{transform:rotate(90deg)}
#panelClip{
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows .45s cubic-bezier(.22,1,.36,1);
  position:sticky; top:56px; z-index:40;
}
body.menu-open #panelClip{grid-template-rows:1fr}
#menuPanel{
  overflow:hidden; min-height:0;
  background:var(--panel); border-bottom:1px solid var(--border);
  box-shadow:0 12px 24px rgba(0,0,0,.08);
  transform:translateY(-14px); opacity:0;
  transition:transform .45s cubic-bezier(.22,1,.36,1), opacity .3s;
}
body.menu-open #menuPanel{transform:translateY(0); opacity:1}
.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 16px}
.menu-item{
  display:flex; align-items:center; gap:10px;
  padding:12px; border-radius:14px;
  border:1px solid var(--border); background:var(--panel2);
  color:var(--text); font-size:15px; font-weight:600;
  cursor:pointer; transition:transform .15s; text-align:left;
}
.menu-item:active{transform:scale(.97)}
.menu-item .mi-icon{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:var(--accent); color:var(--accent-text);
  display:flex; align-items:center; justify-content:center; font-size:17px;
}
.menu-item .chev{margin-left:auto; opacity:.4}
.menu-item.full{grid-column:1 / -1}
.menu-item.active{background:var(--accent); color:var(--accent-text)}
#content{padding:16px; padding-bottom:40px; max-width:640px; margin:0 auto}
.page{display:none; animation:fade .35s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
h2{font-size:20px; margin:6px 0 14px}
.card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px}
.muted{color:var(--muted); font-size:13px}
.stat{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px}
.stat:last-child{border-bottom:none}
.stat b{font-size:16px}
#casesGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.tile{
  background:var(--panel); border:1px solid var(--border); border-radius:16px;
  padding:10px; display:flex; flex-direction:column;
}
.tile-img{
  width:100%; aspect-ratio:1/1; border-radius:12px;
  background:var(--panel2); border:1px dashed var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:48px; margin-bottom:8px; position:relative;
}
.tile-img .badge-stock{
  position:absolute; top:6px; left:6px;
  background:var(--accent); color:var(--accent-text);
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px;
}
.tile-img .badge-time{
  position:absolute; top:6px; right:6px;
  background:#c0392b; color:#fff;
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:12px;
}
.tile-name{font-weight:700; font-size:14px; margin-bottom:2px}
.tile-status{font-size:12px; color:var(--muted); min-height:16px; margin-bottom:6px}
.tile .btn{margin-top:auto; padding:10px; font-size:14px}
.btn{
  width:100%; padding:14px; border-radius:14px; border:none;
  background:var(--accent); color:var(--accent-text);
  font-size:16px; font-weight:700; cursor:pointer; margin-top:8px;
}
.btn.ghost{background:transparent; border:1.5px solid var(--border); color:var(--text)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.ann-card{background:var(--accent); color:var(--accent-text); border-radius:16px; padding:16px; margin-bottom:12px}
.ann-card .muted{color:inherit; opacity:.6}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border)}
.row:last-of-type{border-bottom:none}
.switch{position:relative; width:52px; height:30px; flex:none}
.switch input{opacity:0; width:0; height:0}
.slider{position:absolute; inset:0; border-radius:30px; background:var(--border); cursor:pointer; transition:background .25s}
.slider::before{
  content:''; position:absolute; width:24px; height:24px; border-radius:50%;
  left:3px; top:3px; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.switch input:checked + .slider{background:#141414}
body[data-theme="dark"] .switch input:checked + .slider{background:#f2f2f0}
.switch input:checked + .slider::before{transform:translateX(22px)}
.danger{color:#c0392b}
#invGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.inv-card{border:1px solid var(--border); border-radius:14px; padding:14px; background:var(--panel2); font-size:13px}
.inv-card .p-ico{font-size:26px}
.inv-card .claim-btn{
  margin-top:10px; width:100%; padding:8px; border-radius:10px;
  border:none; background:var(--accent); color:var(--accent-text);
  font-size:13px; font-weight:700; cursor:pointer;
}
#overlay{position:fixed; inset:0; z-index:100; display:none; background:rgba(0,0,0,.55); backdrop-filter:blur(4px); align-items:center; justify-content:center; padding:20px}
#overlay.on{display:flex}
#caseModal{background:var(--panel); border-radius:20px; width:100%; max-width:420px; max-height:86vh; overflow-y:auto; padding:20px; animation:fade .3s ease}
#stripView{overflow:hidden; border-radius:12px; border:1px solid var(--border); margin:16px 0; position:relative}
#stripView::before,#stripView::after{
  content:''; position:absolute; top:0; bottom:0; width:2px; background:var(--accent); z-index:2;
}
#stripView::before{left:50%; transform:translateX(-1px)}
#strip{display:flex; will-change:transform}
.prize-cell{flex:none; width:96px; margin:6px 4px; padding:14px 4px; border:1px solid var(--border); border-radius:12px; text-align:center; font-size:13px; background:var(--panel2)}
.prize-cell .p-ico{font-size:24px; display:block; margin-bottom:6px}
.prize-cell.hl{outline:2px solid var(--accent)}
/* ===== админка ===== */
.a-label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin:10px 0 4px}
.a-input{
  width:100%; padding:10px 12px; border-radius:10px;
  border:1.5px solid var(--border); background:var(--panel2);
  color:var(--text); font-size:15px; outline:none;
}
.a-input:focus{border-color:var(--text)}
textarea.a-input{min-height:110px; resize:vertical; font-family:inherit}
.a-hint{font-size:11px; color:var(--muted); margin:3px 0 6px}
.a-btn{
  padding:8px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); font-size:14px;
  font-weight:600; cursor:pointer; margin:6px 6px 0 0;
}
.a-btn.del{border-color:#c0392b; color:#c0392b}
.a-case{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--border); font-size:14px}
.a-case .a-info{flex:1; min-width:0}
.a-case .a-sub{font-size:11px; color:var(--muted)}
.a-case .a-actions{white-space:nowrap}
/* ===== тикеты и чат ===== */
.ticket{border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px; font-size:13px}
.ticket .t-head{display:flex; justify-content:space-between; gap:8px; margin-bottom:6px}
.t-badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:10px; border:1px solid var(--border)}
.t-badge.open{color:#b7950b; border-color:#b7950b}
.t-badge.closed{color:var(--muted)}
.chat{max-height:260px; overflow-y:auto; margin-top:8px; padding-right:4px}
.msg{max-width:86%; margin:8px 0; padding:8px 12px; border-radius:14px; font-size:13px; white-space:pre-wrap; word-break:break-word}
.msg .m-head{ /* строка «имя    время» */
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  font-weight:700; font-size:12px; margin-bottom:4px; padding-bottom:3px;
  border-bottom:1px dashed currentColor;
}
.msg .m-head .m-date{font-weight:400; font-size:10px; opacity:.6; flex:none}
.msg .m-text{margin-top:2px}
.msg.user{background:var(--accent); color:var(--accent-text); margin-left:auto; border-bottom-right-radius:4px}
.msg.admin{background:var(--panel2); border:1px solid var(--border); margin-right:auto; border-bottom-left-radius:4px}
.chat-input{display:flex; gap:6px; margin-top:8px}
.chat-input .a-input{margin:0; flex:1}
.acc-panel{margin-top:10px; padding:10px; border:1px dashed var(--border); border-radius:10px; background:var(--panel2); font-size:12px}
.acc-panel .stat{padding:6px 0}
#cloudStatus{font-size:12px; padding:6px 10px; border-radius:8px; background:var(--panel2); border:1px dashed var(--border); margin-bottom:12px}
</style>
</head>
<body>

<header id="appHeader">
  <span class="brand">STAR APP</span>
  <button id="menuBtn" aria-label="Меню">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
</header>

<div id="panelClip">
  <nav id="menuPanel">
    <div class="menu-grid">
      <button class="menu-item" data-page="profile"><span class="mi-icon">👤</span> Профиль <span class="chev">›</span></button>
      <button class="menu-item active" data-page="home"><span class="mi-icon">🏠</span> Главная <span class="chev">›</span></button>
      <button class="menu-item full" data-page="inventory"><span class="mi-icon">📦</span> Инвентарь <span class="chev">›</span></button>
      <button class="menu-item full" data-page="settings"><span class="mi-icon">⚙️</span> Настройки</button>
    </div>
  </nav>
</div>

<main id="content">

  <section class="page on" id="page-home">
    <h2>Главная</h2>
    <div id="cloudStatus">☁️ Подключаемся к Firebase...</div>
    <div id="annSlot"></div>
    <div class="card">
      <b id="homeGreet">Привет!</b>
      <div class="stat" style="margin-top:8px"><span>⭐ Баланс</span><b id="homeStars">0</b></div>
    </div>
    <div id="casesGrid"></div>
  </section>

  <section class="page" id="page-profile">
    <h2>Профиль</h2>
    <div class="card">
      <div class="stat"><span>👤 Имя</span><b id="profName">—</b></div>
      <div class="stat"><span>🔗 Username</span><b id="profUsername">—</b></div>
      <div class="stat"><span>🆔 Telegram ID</span><b id="profTgId">—</b></div>
    </div>
    <div class="card">
      <div class="stat"><span>⭐ Баланс звёзд</span><b id="statStars">0</b></div>
      <div class="stat"><span>📦 Предметов</span><b id="statItems">0</b></div>
    </div>
  </section>

  <section class="page" id="page-inventory">
    <h2>Инвентарь</h2>
    <div id="invGrid"></div>
    <p class="muted" id="invEmpty" style="text-align:center;margin-top:20px">Пока пусто — откройте кейс на главной 🎁</p>
  </section>

  <section class="page" id="page-settings">
    <h2>Настройки</h2>
    <div class="card">
      <div class="row">
        <span>🌙 Тёмная тема</span>
        <label class="switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <b>🎧 Поддержка</b>
      <div id="ticketPanel" style="margin-top:10px"></div>
    </div>

    <div class="card" id="adminCard">
      <b>🛠 Админ-панель</b>
      <div id="adminPanel" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="row" style="border:none;padding-bottom:0">
        <span>Сброс прогресса</span>
        <button class="btn ghost danger" id="resetBtn" style="width:auto;padding:8px 16px;margin:0">Сбросить</button>
      </div>
    </div>
  </section>

</main>

<div id="overlay">
  <div id="caseModal">
    <div id="caseMenu">
      <b style="font-size:18px" id="modalTitle">🎁 Кейс</b>
      <p class="muted" style="margin:6px 0 12px">Призы и шансы:</p>
      <div id="prizeList"></div>
      <button class="btn" id="openBtn">Открыть</button>
      <button class="btn ghost" id="closeMenuBtn">Закрыть</button>
    </div>
    <div id="caseSpin" style="display:none">
      <b style="font-size:18px">Крутим...</b>
      <div id="stripView"><div id="strip"></div></div>
      <div id="spinResult" style="text-align:center;font-weight:700;min-height:24px;margin-bottom:8px"></div>
      <button class="btn ghost" id="closeSpinBtn" style="display:none">Забрать и закрыть</button>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   СЮДА ВСТАВИТЬ КОНФИГ — Project settings → Your apps
   ================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB9uAa0NjkxMvjK0ZrGGHBtksWWRZA2cPs",
  authDomain: "syq-site.firebaseapp.com",
  databaseURL: "https://syq-site-default-rtdb.firebaseio.com",
  projectId: "syq-site",
  storageBucket: "syq-site.firebasestorage.app",
  messagingSenderId: "309704145783",
  appId: "1:309704145783:web:3d525163e0fbb1f7723f72",
  measurementId: "G-QV7MG6M9V4"
};

/* ==================================================================
   АДМИНЫ: список Telegram ID (несколько через запятую).
   ADMIN_CODE — резервный вход кодом (тест в браузере).
   ================================================================== */
const ADMIN_IDS  = [8158896250];
const ADMIN_CODE = 'admin123';

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const haptic = t => { try { if (tg) tg.HapticFeedback.impactOccurred(t); } catch(e){} };

/* Имя пользователя: @username или имя из Telegram — вручную не вводится */
const MY_NAME = tgUser
  ? (tgUser.username ? '@' + tgUser.username : (tgUser.first_name || 'Гость'))
  : 'Гость';

/* ==================================================================
   КОНФИГУРАЦИЯ КЕЙСОВ (дефолт заливается в Firebase, если база пуста)
   ================================================================== */
const DEF_CASES = [{
  id: 1, ico: '🎁', name: 'Стартовый кейс', desc: 'Бесплатный кейс для новичков',
  cd: 60, price: 0, stock: 0, hours: 0,
  prizes: [
    {name:'25 звёзд',   chance:40, type:'stars', value:25},
    {name:'100 звёзд',  chance:30, type:'stars', value:100},
    {name:'250 звёзд',  chance:15, type:'stars', value:250},
    {name:'500 звёзд',  chance:10, type:'stars', value:500},
    {name:'Подарок 🏆', chance:5,  type:'item',  value:'🏆'}
  ]
}];

/* ---------- ЛОКАЛЬНОЕ СОСТОЯНИЕ ---------- */
const DEF = {theme:'light', admin:false, stars:0, items:[], cases:DEF_CASES, lastFree:{}};
let S = {...DEF};
try { S = {...DEF, ...JSON.parse(localStorage.getItem('starApp') || '{}')}; } catch(e){}
const saveLocal = () => localStorage.setItem('starApp', JSON.stringify(S));
const save = () => { saveLocal(); if (USER_REF){ clearTimeout(pushTimer); pushTimer = setTimeout(pushUser, 300); } };
if (S.theme === 'dark') document.body.dataset.theme = 'dark';

/* чистка битых предметов из старых версий (защита от undefined-баланса) */
S.items = (Array.isArray(S.items) ? S.items : [])
  .filter(it => it && it.name)
  .map(it => ({
    name: String(it.name),
    ico:  it.ico || '⭐',
    type: it.type === 'item' ? 'item' : 'stars',
    stars: Math.max(0, parseInt(it.stars, 10) || 0),
    date: it.date || ''
  }))
  .filter(it => it.type !== 'stars' || it.stars > 0);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtLeft = ms => {
  const s = Math.max(0, Math.ceil(ms/1000));
  if (s >= 3600) return Math.floor(s/3600) + 'ч ' + Math.floor(s%3600/60) + 'м';
  if (s >= 60)   return Math.floor(s/60) + 'м';
  return s + ' с';
};

/* ==================================================================
   FIREBASE
   Ветки: users/<ключ>/, cases/, caseStock/<id>/, announcement/, tickets/<id>/
   ================================================================== */
let USER_REF = null, MY_KEY = '', MY_TG_ID = 0, cloudReady = false, pushTimer = null;

const fbApp = firebase.initializeApp(firebaseConfig);
const db    = firebase.database();

function pushUser(){
  if (!USER_REF) return;
  USER_REF.set({ name:MY_NAME, tgId:MY_TG_ID||'', stars:S.stars, items:S.items, lastFree:S.lastFree })
    .catch(e => setCloudStatus('⚠️ Ошибка записи: ' + (e.code || e.message)));
}
function setCloudStatus(t){ document.getElementById('cloudStatus').textContent = t; }

async function initCloud(){
  try{
    await firebase.auth().signInAnonymously();
    const uid = firebase.auth().currentUser.uid;
    MY_TG_ID = tgUser ? tgUser.id : 0;
    const key = tgUser ? 'tg' + tgUser.id : 'a' + uid;
    MY_KEY = key;
    USER_REF = db.ref('users/' + key);

    const snap = await USER_REF.get();
    if (snap.exists()){
      S.stars = Number(snap.val().stars) || 0;
      S.items = Array.isArray(snap.val().items) ? snap.val().items : [];
      S.lastFree = snap.val().lastFree || {};
    } else pushUser();
    saveLocal();

    const cs = await db.ref('cases').get();
    if (cs.exists() && cs.val()) S.cases = Object.values(cs.val());
    else await db.ref('cases').set(DEF_CASES);

    cloudReady = true;
    setCloudStatus('☁️ Данные синхронизированы');

    db.ref('cases').on('value', s => {
      S.cases = s.exists() ? Object.values(s.val()) : DEF_CASES;
      saveLocal(); renderAll();
    });
    db.ref('caseStock').on('value', s => { S.stockLive = s.val() || {}; renderCases(); });
    db.ref('announcement').on('value', s => { S.ann = s.val() || null; renderAnn(); });
    db.ref('tickets').on('value', s => {
      const v = s.val() || {};
      S.tickets = Object.entries(v).map(([k, t]) => ({...t, _id: k}));
      renderTickets(); renderAdmin();
    });
    USER_REF.on('value', s => {
      if (!s.exists()) return;
      S.stars = Number(s.val().stars) || 0;
      S.items = Array.isArray(s.val().items) ? s.val().items : [];
      S.lastFree = s.val().lastFree || {};
      saveLocal(); renderAll();
    });

    if (MY_TG_ID && ADMIN_IDS.includes(MY_TG_ID)) { S.admin = true; saveLocal(); }
  } catch(e){
    setCloudStatus('⚠️ Firebase недоступен — работаем локально (' + (e.code || e.message) + ')');
  }
  renderAll();
}

/* ==================================================================
   МЕНЮ И НАВИГАЦИЯ
   ================================================================== */
document.getElementById('menuBtn').addEventListener('click', () => {
  document.body.classList.toggle('menu-open'); haptic('light');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('menu-open'); });

const pages = document.querySelectorAll('.page');
document.querySelectorAll('.menu-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = btn.dataset.page;
    pages.forEach(pg => pg.classList.toggle('on', pg.id === 'page-' + p));
    document.querySelectorAll('.menu-item').forEach(b => b.classList.toggle('active', b === btn));

function tickFree(){

      el.textContent = left > 0
        ? '⏳ Доступно через ' + fmtLeft(left)
        : (c.endsAt ? '✅ Доступен · закроется через ' + fmtLeft(c.endsAt - Date.now()) : '✅ Доступен');

const overlay = document.getElementById('overlay');
let currentCase = null;

window.openCase = id => {
  const c = S.cases.find(x => x.id === id);
  if (!c) return;
  if (c.endsAt && Date.now() > c.endsAt) return alert('Время акции вышло');
  currentCase = c;
  document.getElementById('modalTitle').textContent = c.ico + ' ' + c.name;
  document.getElementById('prizeList').innerHTML = c.prizes.map(p =>
    '<div class="case-item" style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:14px">' +
      '<span>' + esc(p.name) + '</span><b style="color:var(--muted)">' + (Number(p.chance) || 0) + '%</b></div>'
  ).join('');

    c.price > 0 ? 'Открыть за ' + c.price + ' ⭐' : 'Открыть бесплатно';
  overlay.classList.add('on'); haptic('medium');
};

document.getElementById('closeMenuBtn').addEventListener('click', closeCase);
document.getElementById('closeSpinBtn').addEventListener('click', closeCase);
overlay.addEventListener('click', e => { if (e.target === overlay) closeCase(); });

function closeCase(){
  overlay.classList.remove('on');
  document.getElementById('caseSpin').style.display = 'none';
  document.getElementById('closeSpinBtn').style.display = 'none';
  document.getElementById('spinResult').textContent = '';
}

function spinPrize(caseObj){
  let r = Math.random() * 100, acc = 0;
  for (const p of caseObj.prizes){ acc += (Number(p.chance) || 0); if (r <= acc) return p; }
  return caseObj.prizes[0];
}

document.getElementById('openBtn').addEventListener('click', async () => {
  const c = currentCase;
  if (!c) return;
  if (c.endsAt && Date.now() > c.endsAt) return alert('Время акции вышло');

  const left = (S.lastFree[c.id] || 0) + (c.cd || 0) * 1000 - Date.now();
  if (left > 0) return alert('Подождите ' + Math.ceil(left/1000) + ' с');

  if (c.price > 0 && S.stars < c.price)
    return alert('Не хватает звёзд: нужно ' + c.price + ', у вас ' + S.stars);

  let stock = null;
  if (cloudReady){
    try { const s = await db.ref('caseStock/' + c.id).get(); if (s.exists()) stock = s.val(); } catch(e){}
  }
  if (stock !== null && stock <= 0) return alert('Этот кейс закончился 😢');

  if (c.price > 0) S.stars -= c.price;
  S.lastFree[c.id] = Date.now();
  if (stock !== null) db.ref('caseStock/' + c.id).set(stock - 1).catch(()=>{});
  save(); tickFree();
  haptic('rigid');

  startSpin(c);
});

function startSpin(c){
  document.getElementById('caseMenu').style.display = 'none';
  document.getElementById('caseSpin').style.display = '';
  const prize = spinPrize(c);
  const strip = document.getElementById('strip');
  const cells = [];
  const N = 42, WIN = 34;
  for (let i = 0; i < N; i++){
    const p = c.prizes[Math.floor(Math.random() * c.prizes.length)];
    const d = document.createElement('div');
    d.className = 'prize-cell';
    d.innerHTML = '<span class="p-ico">' + esc(p.type === 'item' ? p.value : '⭐') + '</span>' + esc(p.name);
    strip.appendChild(d); cells.push(d);
  }
  cells[WIN].innerHTML = '<span class="p-ico">' + esc(prize.type === 'item' ? prize.value : '⭐') + '</span>' + esc(prize.name);

  strip.style.transition = 'none'; strip.style.transform = 'translateX(0)';
  const cw = 104;
  const view = document.getElementById('stripView').offsetWidth;
  const offset = WIN * cw + cw/2 - view/2;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    strip.style.transition = 'transform 4.2s cubic-bezier(.15,.9,.2,1)';
    strip.style.transform = 'translateX(-' + offset + 'px)';
  }));

  setTimeout(() => {
    cells[WIN].classList.add('hl');
    document.getElementById('spinResult').textContent = '🎉 Выпало: ' + prize.name + ' — отправлено в инвентарь!';
    haptic('heavy');
    S.items.unshift({
      name: prize.name,
      ico: prize.type === 'item' ? prize.value : '⭐',
      type: prize.type,
      stars: prize.type === 'stars' ? (parseInt(prize.value, 10) || 0) : 0,
      date: new Date().toLocaleDateString()
    });
    save(); renderAll();
    document.getElementById('closeSpinBtn').style.display = '';
    strip.style.transition = ''; strip.innerHTML = '';
    cells[WIN].classList.remove('hl');
  }, 4400);
}

window.claimStars = i => {
  const it = S.items[i];
  if (!it || it.type !== 'stars') return;
  const amount = parseInt(it.stars, 10) || 0;
  if (amount <= 0){ S.items.splice(i, 1); save(); renderAll(); return; }
  S.stars += amount;

};

/* ==================================================================
   ТИКЕТЫ ПОДДЕРЖКИ — ЧАТ
   tickets/<pushId>/{ userKey, name, tgId, status, date, messages }
   status: 'open' — переписка идёт, 'closed' — тикет в истории, писать нельзя
   ================================================================== */

/* Рисует один тикет (для пользователя или админа).
   Формат сообщения: сверху «имя    время», ниже — текст. */
function ticketHtml(t, isAdmin){
  const msgs = t.messages ? Object.values(t.messages) : [];
  const isOpen = t.status === 'open';
  return '<div class="ticket">' +
    '<div class="t-head"><b>' + esc(t.name) + (t.tgId ? ' · ID ' + esc(t.tgId) : '') + '</b>' +
      '<span class="t-badge ' + (isOpen ? 'open' : 'closed') + '">' + (isOpen ? 'Открыт' : 'Закрыт') + '</span></div>' +
    '<div class="muted">' + esc(t.date) + '</div>' +
    '<div class="chat">' +
      (msgs.length
        ? msgs.map(m =>
            '<div class="msg ' + (m.from === 'admin' ? 'admin' : 'user') + '">' +
              '<div class="m-head">' +
                '<span class="m-name">' + esc(m.from === 'admin' ? 'Поддержка' : (t.name || 'Вы')) + '</span>' +
                '<span class="m-date">' + esc(m.date || '') + '</span>' +
              '</div>' +
              '<div class="m-text">' + esc(m.text) + '</div>' +
            '</div>'
          ).join('')
        : '<p class="muted">Сообщений пока нет.</p>') +
    '</div>' +
    (isOpen
      ? '<div class="chat-input">' +
          '<input class="a-input" placeholder="Сообщение...">' +
          '<button class="a-btn" onclick="sendMsg(\'' + esc(t._id) + '\', this)">➤</button>' +
        '</div>'
      : '') +
    (isAdmin
      ? '<div class="acc-panel" id="acc-' + esc(t._id) + '"><span class="muted">Нажмите «Показать аккаунт»</span></div>' +
        '<button class="a-btn" onclick="loadAcc(\'' + esc(t._id) + '\')">📋 Показать аккаунт</button>' +
        (isOpen ? '<button class="a-btn del" onclick="closeTicket(\'' + esc(t._id) + '\')">🔒 Закрыть тикет</button>' : '')
      : '') +
  '</div>';
}

/* Панель поддержки: форма + открытые тикеты + история */
function renderTickets(){
  const wrap = document.getElementById('ticketPanel');
  if (!cloudReady){
    wrap.innerHTML = '<p class="muted">Ждём подключения к Firebase…</p>';
    return;
  }
  const mine = (S.tickets || []).filter(t => t.userKey === MY_KEY);
  const open = mine.filter(t => t.status === 'open');
  const closed = mine.filter(t => t.status === 'closed');

  wrap.innerHTML =
    '<textarea class="a-input" id="ticketText" placeholder="Опишите проблему или задайте вопрос" style="min-height:70px"></textarea>' +
    '<span class="a-hint">Имя и ID подставятся автоматически из Telegram.</span>' +
    '<button class="a-btn" onclick="sendTicket()">Создать обращение</button>' +
    (open.length ? '<div class="muted" style="margin-top:10px">Открытые обращения:</div>' : '') +
    open.map(t => ticketHtml(t, false)).join('') +
    (closed.length
      ? '<div class="muted" style="margin-top:14px">История обращений:</div>' +
        closed.map(t => ticketHtml(t, false)).join('')
      : '');
}

/* «Создать обращение» */
window.sendTicket = () => {
  const text = document.getElementById('ticketText').value.trim();
  if (!text) return alert('Напишите, что случилось');
  db.ref('tickets').push({
    userKey: MY_KEY,
    name: MY_NAME,
    tgId: MY_TG_ID || '',
    text, status: 'open',
    date: new Date().toLocaleString(),
    messages: { first: { from:'user', text, date: new Date().toLocaleTimeString() } }
  }).then(() => {
    document.getElementById('ticketText').value = '';
    alert('Обращение создано! Продолжайте переписку в чате тикета.');
  }).catch(e => alert('Ошибка: ' + (e.code || e.message)));
};

/* ➤ в чате: отправка сообщения. Инпут ищем рядом с нажатой кнопкой —
   дубли id больше не мешают, а ошибки показываются пользователю */
window.sendMsg = (id, btn) => {
  const inp = btn && btn.parentElement ? btn.parentElement.querySelector('input') : null;
  if (!inp) return;
  const text = inp.value.trim();
  if (!text) return;
  db.ref('tickets/' + id + '/messages').push({
    from: S.admin ? 'admin' : 'user',
    text,
    date: new Date().toLocaleTimeString()
  }).then(() => inp.value = '')
    .catch(e => alert('Не отправилось: ' + (e.code || e.message)));
};

/* 🔒 Закрыть тикет: уезжает в «Историю обращений» у всех */
window.closeTicket = id => {
  if (!confirm('Закрыть тикет? Он попадёт в историю обращений.')) return;
  db.ref('tickets/' + id).update({ status: 'closed', closedAt: new Date().toLocaleString() })
    .catch(e => alert('Ошибка: ' + (e.code || e.message)));
};

/* ==================================================================
   ПАНЕЛЬ АККАНУТА В ТИКЕТЕ (для админа)
   ================================================================== */
window.loadAcc = async id => {
  const t = (S.tickets || []).find(x => x._id === id);
  if (!t) return;
  const box = document.getElementById('acc-' + id);
  if (!box) return;
  try{
    const snap = await db.ref('users/' + t.userKey).get();
    if (!snap.exists()){ box.innerHTML = '<span class="muted">Аккаунт не найден.</span>'; return; }
    const d = snap.val();
    const items = Array.isArray(d.items) ? d.items : [];

    box.innerHTML =
      '<b>Аккаунт автора</b>' +
      '<div class="stat"><span>👤 Имя</span><b>' + esc(d.name || '—') + '</b></div>' +
      '<div class="stat"><span>🆔 Telegram ID</span><b>' + esc(d.tgId || '—') + '</b></div>' +
      '<div class="stat"><span>⭐ Баланс</span><b>' + (Number(d.stars) || 0) + '</b></div>' +
      '<div class="stat"><span>📦 Предметов</span><b>' + items.length + '</b></div>' +
      '<div class="chat-input">' +
        '<input class="a-input" id="accNew-' + id + '" type="number" placeholder="Новый баланс">' +
        '<button class="a-btn" onclick="setStars(\'' + id + '\')">Установить</button>' +
      '</div>' +
      '<div class="chat-input">' +
        '<input class="a-input" id="accAdd-' + id + '" type="number" placeholder="Сумма ±">' +
        '<button class="a-btn" onclick="addStars(\'' + id + '\', 1)">+ Начислить</button>' +
        '<button class="a-btn del" onclick="addStars(\'' + id + '\', -1)">− Списать</button>' +
      '</div>' +
      (items.length
        ? '<div class="muted" style="margin-top:6px">Инвентарь (🗑 — удалить предмет):</div>' +
          items.map((it, i) =>
            '<div class="stat"><span>' + esc(it.ico) + ' ' + esc(it.name) + '</span>' +
            '<span><button class="a-btn del" style="padding:3px 10px;margin:0" onclick="delUserItem(\'' + id + '\', ' + i + ')">🗑</button></span></div>'
          ).join('')
        : '<div class="muted" style="margin-top:6px">Инвентарь пуст.</div>');
  } catch(e){
    box.innerHTML = '<span class="muted">Ошибка: ' + esc(e.code || e.message) + '</span>';
  }
};

/* Установить точное значение баланса автора */
window.setStars = id => {
  const t = (S.tickets || []).find(x => x._id === id);
  const v = parseInt(document.getElementById('accNew-' + id).value, 10);
  if (!t || isNaN(v) || v < 0) return alert('Введите число от 0');
  db.ref('users/' + t.userKey + '/stars').set(v)
    .then(() => alert('Баланс установлен: ' + v))
    .catch(e => alert('Ошибка: ' + (e.code || e.message)));
};

/* Начислить (+1) или списать (−1) звёзды у автора */
window.addStars = (id, sign) => {
  const t = (S.tickets || []).find(x => x._id === id);
  const v = parseInt(document.getElementById('accAdd-' + id).value, 10);
  if (!t || isNaN(v) || v <= 0) return alert('Введите сумму больше нуля');
  db.ref('users/' + t.userKey + '/stars').transaction(cur => Math.max(0, (Number(cur) || 0) + sign * v))
    .then(() => alert(sign > 0 ? 'Начислено: +' + v : 'Списано: −' + v))
    .catch(e => alert('Ошибка: ' + (e.code || e.message)));
};

/* Удалить предмет из инвентаря автора (с защитой от отсутствия аккаунта) */
window.delUserItem = async (id, idx) => {
  const t = (S.tickets || []).find(x => x._id === id);
  if (!t) return;
  try{
    const snap = await db.ref('users/' + t.userKey).get();
    if (!snap.exists()) return alert('Аккаунт не найден');
    const items = Array.isArray(snap.val().items) ? snap.val().items : [];
    if (!items[idx]) return;
    items.splice(idx, 1);
    await db.ref('users/' + t.userKey + '/items').set(items);
    alert('Предмет удалён');
    loadAcc(id);
  } catch(e){
    alert('Ошибка: ' + (e.code || e.message));
  }
};

        '<input class="a-input" id="cHours" type="number" min="0" step="0.5" value="' + (c.endsAt ? hoursLeft.toFixed(1) : 0) + '">' +
        '<span class="a-hint">0 = бессрочно. Иначе кейс закроется через это время с момента сохранения.</span>' +
        '<label class="a-label">Призы (один на строку)</label>' +
        '<textarea class="a-input" id="cPrizes" placeholder="25 звёзд | 40 | stars | 25">' +
          c.prizes.map(p => p.name + ' | ' + p.chance + ' | ' + p.type + ' | ' + p.value).join('\n') +
        '</textarea>' +
        '<span class="a-hint">Формат: Название | шанс% | stars/item | значение.<br>Примеры:<br>25 звёзд | 40 | stars | 25<br>Корона | 2 | item | 👑</span>' +
        '<button class="a-btn" onclick="saveCase()">Сохранить</button>' +
        '<button class="a-btn" onclick="cancelEdit()">Отмена</button>' +
      '</div>';
  } else {
    html += '<button class="a-btn" onclick="editCase(\'new\')">＋ Добавить кейс</button>';
  }
  html += '</div>';

  /* --- тикеты: активные чаты + закрытые в истории --- */
  const allT = S.tickets || [];
  const openT = allT.filter(t => t.status === 'open');
  const closedT = allT.filter(t => t.status === 'closed');
  html += '<div><b>🎧 Обращения (' + openT.length + ' открытых)</b>' +
    (openT.length ? openT.map(t => ticketHtml(t, true)).join('') : '<p class="a-hint">Открытых обращений нет.</p>') +
    (closedT.length
      ? '<div class="muted" style="margin-top:12px">История обращений:</div>' +
        closedT.map(t => ticketHtml(t, true)).join('')
      : '') +
  '</div>';

  wrap.innerHTML = html;
}

window.editCase   = id => { editingId = id; renderAdmin(); };
window.cancelEdit = () => { editingId = null; renderAdmin(); };

window.delCase = id => {
  if (!confirm('Удалить кейс? Изменение увидят все пользователи.')) return;
  S.cases = S.cases.filter(c => c.id !== id);
  saveLocal();
  db.ref('cases').set(S.cases).catch(e => alert('Ошибка: ' + (e.code || e.message)));
  db.ref('caseStock/' + id).remove().catch(()=>{});
  renderAll();
};

window.saveCase = () => {
  const prizes = document.getElementById('cPrizes').value
    .split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => {
      const p = l.split('|').map(x => x.trim());
      const type = p[2] === 'item' ? 'item' : 'stars';
      return {
        name:   p[0] || 'Приз',
        chance: Math.min(100, Math.max(0, parseFloat(p[1]) || 0)),
        type,
        value:  type === 'stars' ? Math.max(0, parseInt(p[3], 10) || 0) : (p[3] || '⭐')
      };
    });

  const stock = Math.max(0, parseInt(document.getElementById('cStock').value, 10) || 0);
  const hours = Math.max(0, parseFloat(document.getElementById('cHours').value) || 0);

  const data = {
    ico:  document.getElementById('cIco').value.trim() || '🎁',
    name: document.getElementById('cName').value.trim() || 'Без названия',
    desc: document.getElementById('cDesc').value.trim(),
    cd:   Math.max(0, parseInt(document.getElementById('cCd').value, 10) || 0),
    price:Math.max(0, parseInt(document.getElementById('cPrice').value, 10) || 0),
    stock,
    endsAt: hours > 0 ? Date.now() + hours * 3600000 : 0,
    prizes
  };

  let caseId;
  if (editingId === 'new'){ caseId = Date.now(); S.cases.push({id: caseId, ...data}); }
  else {
    caseId = editingId;
    const c = S.cases.find(x => x.id === caseId);
    if (c) Object.assign(c, data);
  }
  editingId = null;
  saveLocal();
  db.ref('cases').set(S.cases).catch(e => alert('Ошибка: ' + (e.code || e.message)));
  if (stock > 0) db.ref('caseStock/' + caseId).set(stock).catch(()=>{});
  else db.ref('caseStock/' + caseId).remove().catch(()=>{});
  renderAll();
};

window.publishAnn = () => {
  const text = document.getElementById('annText').value.trim();
  if (!text) return alert('Введите текст объявления');
  db.ref('announcement').set({ text, date: new Date().toLocaleString() })
    .then(() => alert('Опубликовано'))
    .catch(e => alert('Ошибка: ' + (e.code || e.message)));
};

window.removeAnn = () => {
  if (!confirm('Убрать объявление с главной?')) return;
  db.ref('announcement').remove().catch(e => alert('Ошибка: ' + (e.code || e.message)));
};

function renderProfile(){
  document.getElementById('profName').textContent = MY_NAME;
  document.getElementById('profUsername').textContent = tgUser && tgUser.username ? '@' + tgUser.username : '—';
  document.getElementById('profTgId').textContent = MY_TG_ID ? String(MY_TG_ID) : '—';
}
function renderAll(){
  document.getElementById('statStars').textContent = S.stars;
  document.getElementById('statItems').textContent = S.items.length;
  document.getElementById('homeStars').textContent = S.stars;
  document.getElementById('homeGreet').textContent = 'Привет, ' + MY_NAME + '!';
  renderProfile(); renderCases(); renderInv(); renderAdmin(); renderAnn(); renderTickets();
}
renderAll();
initCloud();
